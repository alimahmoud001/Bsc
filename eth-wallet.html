<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محفظة ETH & USDT</title>
    <script src="https://cdn.ethers.io/lib/ethers-5.2.umd.min.js" type="application/javascript"></script>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --primary-color: #ffcc00;
            --secondary-bg: #1a1a1a;
            --border-color: #333333;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background-color: var(--secondary-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.1);
        }
        h1, h2 {
            text-align: center;
            color: var(--primary-color);
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            background-color: #000;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .balance-card {
            background: #222;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-right: 4px solid var(--primary-color);
        }
        .balance-item {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }
        .range-container {
            margin: 20px 0;
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 5px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 25px;
            height: 25px;
            background: var(--primary-color);
            border-radius: 50%;
            cursor: pointer;
        }
        .percentage-display {
            text-align: center;
            font-size: 20px;
            margin-top: 5px;
            color: var(--primary-color);
        }
        .copy-btn {
            background-color: #333;
            color: var(--primary-color);
            padding: 5px 10px;
            font-size: 12px;
            width: auto;
            margin: 5px 0;
        }
        .hidden {
            display: none;
        }
        #countdown {
            color: #ff4444;
            font-weight: bold;
            text-align: center;
            font-size: 24px;
            margin: 10px 0;
        }
        .status {
            text-align: center;
            margin: 10px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container" id="login-screen">
    <h1>تسجيل الدخول</h1>
    <div class="input-group">
        <label>العنوان العام (Public Address)</label>
        <input type="text" id="public-address" placeholder="0x...">
    </div>
    <button onclick="login()">دخول</button>
</div>

<div class="container hidden" id="wallet-screen">
    <h2>المحفظة</h2>
    <div class="balance-card">
        <div class="balance-item">
            <span>رصيد ETH:</span>
            <span id="eth-balance">0.00</span>
        </div>
        <div class="balance-item">
            <span>رصيد USDT:</span>
            <span id="usdt-balance">0.00</span>
        </div>
    </div>

    <div class="input-group">
        <label>نوع العملة</label>
        <select id="asset-type" style="width:100%; padding:10px; background:#000; color:#fff; border-radius:8px;">
            <option value="ETH">ETH</option>
            <option value="USDT">USDT</option>
        </select>
    </div>

    <div class="input-group">
        <label>عنوان المستلم</label>
        <input type="text" id="recipient-address" placeholder="0x...">
    </div>

    <div class="range-container">
        <label>النسبة من الرصيد</label>
        <input type="range" id="amount-range" min="0" max="100" value="0" oninput="updateAmountByRange()">
        <div class="percentage-display"><span id="range-value">0</span>%</div>
    </div>

    <div class="input-group">
        <label>المبلغ</label>
        <input type="number" id="send-amount" step="0.000001" placeholder="0.0">
    </div>

    <button onclick="createUnsignedTx()">تكوين معاملة غير موقعة</button>

    <div id="unsigned-tx-area" class="hidden">
        <label>المعاملة غير الموقعة (كود):</label>
        <textarea id="unsigned-tx-data" rows="4" readonly></textarea>
        <button class="copy-btn" onclick="copyToClipboard('unsigned-tx-data')">نسخ المعاملة</button>
    </div>

    <hr style="border: 0.5px solid #333; margin: 20px 0;">

    <div class="input-group">
        <label>الصق التوقيع المشفر هنا:</label>
        <textarea id="signed-tx-input" rows="4" placeholder="الصق التوقيع الذي حصلت عليه من ملف الموقّع..."></textarea>
    </div>
    <button onclick="startBroadcastProcess()">بث المعاملة</button>

    <div id="broadcast-area" class="hidden">
        <div id="countdown">30</div>
        <button id="cancel-btn" style="background-color: #ff4444;" onclick="cancelBroadcast()">إلغاء الإرسال</button>
    </div>

    <div class="status" id="status-msg"></div>
</div>

<script>
    const USDT_ADDRESS = "0xdAC17F958D2ee523a2206206994597C13D831ec7";
    const USDT_ABI = ["function balanceof(address) view returns (uint256)", "function decimals() view returns (uint8)", "function transfer(address, uint256) returns (bool)"];
    
    // استخدام Infura أو Alchemy كمزود (للعرض فقط، في الواقع يحتاج مفتاح API)
    const provider = new ethers.providers.CloudflareProvider();
    
    let currentAddress = "";
    let ethBalance = "0";
    let usdtBalance = "0";
    let countdownInterval;
    let pendingTx = null;

    async function login() {
        const addr = document.getElementById('public-address').value.trim();
        if (ethers.utils.isAddress(addr)) {
            currentAddress = addr;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('wallet-screen').classList.remove('hidden');
            refreshBalances();
        } else {
            alert("العنوان غير صحيح");
        }
    }

    async function refreshBalances() {
        try {
            const ethBal = await provider.getBalance(currentAddress);
            ethBalance = ethers.utils.formatEther(ethBal);
            document.getElementById('eth-balance').innerText = parseFloat(ethBalance).toFixed(4);

            const usdtContract = new ethers.Contract(USDT_ADDRESS, USDT_ABI, provider);
            const usdtBal = await usdtContract.balanceof(currentAddress);
            usdtBalance = ethers.utils.formatUnits(usdtBal, 6);
            document.getElementById('usdt-balance').innerText = parseFloat(usdtBalance).toFixed(2);
        } catch (e) {
            console.error(e);
            document.getElementById('status-msg').innerText = "خطأ في جلب الرصيد";
        }
    }

    function updateAmountByRange() {
        const percent = document.getElementById('amount-range').value;
        document.getElementById('range-value').innerText = percent;
        const asset = document.getElementById('asset-type').value;
        const total = asset === "ETH" ? ethBalance : usdtBalance;
        const amount = (parseFloat(total) * (percent / 100)).toFixed(asset === "ETH" ? 6 : 2);
        document.getElementById('send-amount').value = amount;
    }

    async function createUnsignedTx() {
        const asset = document.getElementById('asset-type').value;
        const recipient = document.getElementById('recipient-address').value.trim();
        const amount = document.getElementById('send-amount').value;

        if (!ethers.utils.isAddress(recipient)) return alert("عنوان المستلم غير صحيح");
        if (!amount || amount <= 0) return alert("أدخل مبلغاً صحيحاً");

        try {
            document.getElementById('status-msg').innerText = "جاري تكوين المعاملة...";
            const nonce = await provider.getTransactionCount(currentAddress);
            const gasPrice = await provider.getGasPrice();
            
            let tx = {
                to: recipient,
                nonce: nonce,
                gasLimit: 21000,
                gasPrice: gasPrice,
                value: ethers.utils.parseEther(amount),
                chainId: 1 // Mainnet
            };

            if (asset === "USDT") {
                const usdtInterface = new ethers.utils.Interface(USDT_ABI);
                const data = usdtInterface.encodeFunctionData("transfer", [recipient, ethers.utils.parseUnits(amount, 6)]);
                tx.to = USDT_ADDRESS;
                tx.value = 0;
                tx.data = data;
                tx.gasLimit = 60000; // تقدير تقريبي لـ USDT
            }

            // تحويل المعاملة إلى JSON مشفر للتمرير
            const unsignedTx = JSON.stringify(tx);
            document.getElementById('unsigned-tx-data').value = btoa(unsignedTx);
            document.getElementById('unsigned-tx-area').classList.remove('hidden');
            document.getElementById('status-msg').innerText = "تم تكوين المعاملة بنجاح";
        } catch (e) {
            console.error(e);
            document.getElementById('status-msg').innerText = "خطأ في تكوين المعاملة";
        }
    }

    function copyToClipboard(id) {
        const copyText = document.getElementById(id);
        copyText.select();
        document.execCommand("copy");
        alert("تم النسخ!");
    }

    function startBroadcastProcess() {
        const signedTx = document.getElementById('signed-tx-input').value.trim();
        if (!signedTx) return alert("يرجى لصق التوقيع أولاً");
        
        pendingTx = signedTx;
        document.getElementById('broadcast-area').classList.remove('hidden');
        let timeLeft = 30;
        document.getElementById('countdown').innerText = timeLeft;

        countdownInterval = setInterval(async () => {
            timeLeft--;
            document.getElementById('countdown').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                broadcastTx();
            }
        }, 1000);
    }

    function cancelBroadcast() {
        clearInterval(countdownInterval);
        document.getElementById('broadcast-area').classList.add('hidden');
        document.getElementById('status-msg').innerText = "تم إلغاء البث";
        pendingTx = null;
    }

    async function broadcastTx() {
        try {
            document.getElementById('status-msg').innerText = "جاري البث للشبكة...";
            // ملاحظة: ethers.js يتطلب المعاملة الموقعة كاملة للبث
            // في هذا المثال، نفترض أن التوقيع الملصق هو المعاملة الموقعة (Raw Transaction)
            const response = await provider.sendTransaction(pendingTx);
            document.getElementById('status-msg').innerHTML = `تم البث بنجاح! Hash: <br><small>${response.hash}</small>`;
            document.getElementById('broadcast-area').classList.add('hidden');
        } catch (e) {
            console.error(e);
            document.getElementById('status-msg').innerText = "فشل البث: " + e.message;
            document.getElementById('broadcast-area').classList.add('hidden');
        }
    }
</script>

</body>
</html>
