<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محفظة TRON - المراقبة</title>
    <script src="https://cdn.jsdelivr.net/npm/tronweb/dist/TronWeb.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --primary-color: #FFD700;
            --text-color: #FFFFFF;
            --card-bg: #1A1A1A;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #333;
        }
        h2 { color: var(--primary-color); text-align: center; }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #444;
            background: #222;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
        }
        .balance-box { font-size: 24px; text-align: center; margin: 20px 0; }
        .hidden { display: none; }
        #qrcode { display: flex; justify-content: center; margin: 20px 0; background: white; padding: 10px; border-radius: 10px; }
        .timer { color: #ff4444; font-weight: bold; text-align: center; margin: 10px 0; }
        .copy-area { word-break: break-all; background: #222; padding: 10px; border-radius: 5px; font-size: 12px; margin-top: 10px; border: 1px dashed var(--primary-color); }
        video { width: 100%; border-radius: 10px; background: #000; }
    </style>
</head>
<body>
    <div class="container">
        <h2>محفظة TRON</h2>

        <!-- تسجيل الدخول -->
        <div id="login-section" class="card">
            <input type="text" id="public-address" placeholder="أدخل العنوان العام (TRON Address)">
            <button onclick="login()">دخول للمراقبة</button>
        </div>

        <!-- لوحة التحكم -->
        <div id="dashboard" class="hidden">
            <div class="card">
                <div class="balance-box">
                    <div id="trx-balance">0 TRX</div>
                    <div id="usdt-balance" style="font-size: 18px; color: #aaa;">0 USDT</div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button onclick="showReceive()">استقبال</button>
                    <button onclick="showSend()">إرسال</button>
                </div>
            </div>

            <!-- قسم الاستقبال -->
            <div id="receive-section" class="card hidden">
                <h3>عنوان الاستقبال</h3>
                <div id="qrcode"></div>
                <div id="display-address" class="copy-area"></div>
                <button onclick="copyText('display-address')">نسخ العنوان</button>
                <button onclick="backToDash()">رجوع</button>
            </div>

            <!-- قسم الإرسال -->
            <div id="send-section" class="card hidden">
                <h3>إرسال عملات</h3>
                <select id="token-type">
                    <option value="TRX">TRX</option>
                    <option value="USDT">USDT (TRC20)</option>
                </select>
                <input type="number" id="amount" placeholder="الكمية">
                <input type="text" id="recipient" placeholder="عنوان المستلم">
                <button onclick="createUnsignedTx()">تكوين معاملة غير موقعة</button>
                <button onclick="backToDash()">رجوع</button>
            </div>

            <!-- قسم المعاملة غير الموقعة -->
            <div id="unsigned-tx-section" class="card hidden">
                <h3>المعاملة غير الموقعة</h3>
                <div id="unsigned-tx-data" class="copy-area"></div>
                <div id="unsigned-qr" style="display: flex; justify-content: center; margin: 10px; background: white; padding: 5px;"></div>
                <button onclick="copyText('unsigned-tx-data')">نسخ المعاملة</button>
                <hr>
                <h4>لصق التوقيع للبث</h4>
                <input type="text" id="signed-signature" placeholder="الصق التوقيع المشفر هنا">
                <button onclick="startScanner('signature')">تصوير كود التوقيع</button>
                <div id="broadcast-timer" class="timer hidden"></div>
                <button id="broadcast-btn" onclick="broadcastTransaction()">بث المعاملة الآن</button>
                <button id="cancel-btn" class="hidden" onclick="cancelBroadcast()" style="background: #ff4444; color: white;">إلغاء (30 ثانية)</button>
            </div>
        </div>

        <!-- ماسح QR -->
        <div id="scanner-section" class="card hidden">
            <video id="video" playsinline></video>
            <button onclick="stopScanner()">إغلاق الكاميرا</button>
        </div>
    </div>

    <script>
        const tronWeb = new TronWeb({
            fullHost: 'https://api.trongrid.io',
            headers: { "TRON-PRO-API-KEY": "6e9b8f1c-76a1-4e4b-8a8b-3e3b3e3b3e3b" } // مفتاح تجريبي
        });

        let currentAddress = '';
        let unsignedTx = null;
        let broadcastTimeout = null;
        let countdownInterval = null;

        async function login() {
            const addr = document.getElementById('public-address').value;
            if (tronWeb.isAddress(addr)) {
                currentAddress = addr;
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                updateBalances();
            } else {
                alert('عنوان غير صحيح');
            }
        }

        async function updateBalances() {
            try {
                const balance = await tronWeb.trx.getBalance(currentAddress);
                document.getElementById('trx-balance').innerText = (balance / 1000000).toFixed(2) + ' TRX';
                
                // جلب رصيد USDT (عقد USDT الرسمي على ترون)
                const usdtContract = 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t';
                const contract = await tronWeb.contract().at(usdtContract);
                const usdtBal = await contract.balanceOf(currentAddress).call();
                document.getElementById('usdt-balance').innerText = (usdtBal / 1000000).toFixed(2) + ' USDT';
            } catch (e) { console.error(e); }
        }

        function showReceive() {
            document.getElementById('receive-section').classList.remove('hidden');
            document.getElementById('display-address').innerText = currentAddress;
            QRCode.toCanvas(document.createElement('canvas'), currentAddress, function (error, canvas) {
                const qrDiv = document.getElementById('qrcode');
                qrDiv.innerHTML = '';
                qrDiv.appendChild(canvas);
            });
        }

        function showSend() {
            document.getElementById('send-section').classList.remove('hidden');
        }

        function backToDash() {
            document.querySelectorAll('.card').forEach(c => {
                if(c.id !== 'login-section' && c.id !== 'dashboard') c.classList.add('hidden');
            });
        }

        async function createUnsignedTx() {
            const type = document.getElementById('token-type').value;
            const amount = document.getElementById('amount').value;
            const to = document.getElementById('recipient').value;

            try {
                if (type === 'TRX') {
                    unsignedTx = await tronWeb.transactionBuilder.sendTrx(to, amount * 1000000, currentAddress);
                } else {
                    const usdtContract = 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t';
                    const parameter = [{type: 'address', value: to}, {type: 'uint256', value: amount * 1000000}];
                    unsignedTx = await tronWeb.transactionBuilder.triggerSmartContract(usdtContract, "transfer(address,uint256)", {}, parameter, currentAddress);
                    unsignedTx = unsignedTx.transaction;
                }
                
                const txString = JSON.stringify(unsignedTx);
                document.getElementById('unsigned-tx-data').innerText = txString;
                document.getElementById('unsigned-tx-section').classList.remove('hidden');
                
                QRCode.toCanvas(document.createElement('canvas'), txString, { width: 200 }, function (error, canvas) {
                    const qrDiv = document.getElementById('unsigned-qr');
                    qrDiv.innerHTML = '';
                    qrDiv.appendChild(canvas);
                });
            } catch (e) { alert('خطأ في تكوين المعاملة: ' + e); }
        }

        function broadcastTransaction() {
            const signature = document.getElementById('signed-signature').value;
            if(!signature) return alert('يرجى إدخال التوقيع أولاً');
            
            document.getElementById('broadcast-btn').classList.add('hidden');
            document.getElementById('cancel-btn').classList.remove('hidden');
            document.getElementById('broadcast-timer').classList.remove('hidden');
            
            let timeLeft = 30;
            document.getElementById('broadcast-timer').innerText = `سيتم البث خلال ${timeLeft} ثانية...`;
            
            countdownInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('broadcast-timer').innerText = `سيتم البث خلال ${timeLeft} ثانية...`;
                if(timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    executeBroadcast(signature);
                }
            }, 1000);
        }

        async function executeBroadcast(signature) {
            try {
                const tx = JSON.parse(document.getElementById('unsigned-tx-data').innerText);
                tx.signature = [signature];
                const receipt = await tronWeb.trx.sendRawTransaction(tx);
                alert('تم البث بنجاح! ID: ' + receipt.txid);
                location.reload();
            } catch (e) { alert('خطأ في البث: ' + e); }
        }

        function cancelBroadcast() {
            clearInterval(countdownInterval);
            document.getElementById('broadcast-btn').classList.remove('hidden');
            document.getElementById('cancel-btn').classList.add('hidden');
            document.getElementById('broadcast-timer').classList.add('hidden');
            alert('تم إلغاء البث');
        }

        function copyText(id) {
            const text = document.getElementById(id).innerText;
            navigator.clipboard.writeText(text).then(() => alert('تم النسخ!'));
        }

        // ماسح QR مبسط
        let scanningFor = '';
        function startScanner(target) {
            scanningFor = target;
            document.getElementById('scanner-section').classList.remove('hidden');
            const video = document.getElementById('video');
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(function(stream) {
                video.srcObject = stream;
                video.setAttribute("playsinline", true);
                video.play();
                requestAnimationFrame(tick);
            });
        }

        function tick() {
            const video = document.getElementById('video');
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                const canvas = document.createElement("canvas");
                canvas.height = video.videoHeight;
                canvas.width = video.videoWidth;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);
                if (code) {
                    if(scanningFor === 'signature') document.getElementById('signed-signature').value = code.data;
                    stopScanner();
                    return;
                }
            }
            if(!document.getElementById('scanner-section').classList.contains('hidden')) requestAnimationFrame(tick);
        }

        function stopScanner() {
            const video = document.getElementById('video');
            if(video.srcObject) video.srcObject.getTracks().forEach(track => track.stop());
            document.getElementById('scanner-section').classList.add('hidden');
        }
    </script>
</body>
</html>
