<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقّع المعاملات آمن</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --primary-color: #ffcc00;
            --secondary-bg: #111111;
            --border-color: #333333;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background-color: var(--secondary-bg);
            padding: 25px;
            border-radius: 20px;
            box-sizing: border-box;
            border: 1px solid #222;
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 22px;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #888;
        }
        input, textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border-color);
            background-color: #000;
            color: #fff;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
        }
        button {
            width: 100%;
            padding: 16px;
            background-color: var(--primary-color);
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .warning-box {
            background: rgba(255, 68, 68, 0.1);
            color: #ff4444;
            padding: 12px;
            border-radius: 10px;
            font-size: 12px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid rgba(255, 68, 68, 0.2);
        }
        .success-box {
            background: rgba(68, 255, 68, 0.1);
            color: #44ff44;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            border: 1px solid rgba(68, 255, 68, 0.2);
        }
        .copy-btn {
            background: #222;
            color: var(--primary-color);
            border: 1px solid #333;
            padding: 8px;
            font-size: 13px;
            margin-top: 10px;
            width: auto;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>موقّع المعاملات (Signer)</h1>
    
    <div class="warning-box">
        تنبيه: التوقيع يتم داخل متصفحك فقط. لا يتم إرسال المفتاح الخاص لأي خادم.
    </div>

    <div class="input-group">
        <label>المفتاح الخاص (Private Key)</label>
        <input type="password" id="priv-key" placeholder="أدخل مفتاحك الخاص هنا..." autocomplete="off">
    </div>

    <div class="input-group">
        <label>بيانات المعاملة (من الملف الأول)</label>
        <textarea id="unsigned-input" rows="4" placeholder="الصق الكود هنا..."></textarea>
    </div>

    <button onclick="signTx()">توقيع المعاملة الآن</button>

    <div id="result-area" class="hidden">
        <div class="success-box">
            <label style="color:#44ff44">التوقيع الجاهز للبث:</label>
            <textarea id="signed-output" rows="4" readonly style="border-color:#44ff44"></textarea>
            <button class="copy-btn" onclick="copyResult()">نسخ التوقيع بنقرة واحدة</button>
            <p style="font-size:12px; margin-top:10px;">انسخ هذا الكود وضعه في حقل التوقيع بالملف الأول لإتمام العملية.</p>
        </div>
    </div>
    
    <div id="error-msg" style="color:#ff4444; font-size:13px; margin-top:15px; text-align:center;"></div>
</div>

<script>
    async function signTx() {
        const key = document.getElementById('priv-key').value.trim();
        const input = document.getElementById('unsigned-input').value.trim();
        const errEl = document.getElementById('error-msg');
        errEl.innerText = "";

        if (!key || !input) {
            errEl.innerText = "يرجى ملء كافة الحقول";
            return;
        }

        try {
            // 1. فك تشفير البيانات القادمة من الملف الأول
            const decoded = JSON.parse(atob(input));
            
            // 2. إنشاء المحفظة
            const wallet = new ethers.Wallet(key);
            
            // 3. تجهيز المعاملة للتوقيع (تحويل القيم النصية إلى BigNumber)
            const txToSign = {
                to: decoded.to,
                nonce: parseInt(decoded.nonce),
                gasLimit: ethers.BigNumber.from(decoded.gasLimit),
                gasPrice: ethers.BigNumber.from(decoded.gasPrice),
                value: ethers.BigNumber.from(decoded.value),
                chainId: parseInt(decoded.chainId),
                data: decoded.data || "0x"
            };

            // 4. التوقيع
            const signedHex = await wallet.signTransaction(txToSign);

            // 5. عرض النتيجة
            document.getElementById('signed-output').value = signedHex;
            document.getElementById('result-area').classList.remove('hidden');
        } catch (e) {
            console.error(e);
            errEl.innerText = "خطأ: " + e.message;
        }
    }

    function copyResult() {
        const el = document.getElementById('signed-output');
        el.select();
        document.execCommand('copy');
        alert("تم نسخ التوقيع بنجاح");
    }
</script>

</body>
</html>
