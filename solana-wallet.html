<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محفظة Solana - المعاملات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <style>
        body { background-color: #000; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .btn-yellow { background-color: #ffcc00; color: #000; font-weight: bold; transition: 0.3s; }
        .btn-yellow:hover { background-color: #e6b800; }
        .card { background-color: #1a1a1a; border: 1px solid #333; border-radius: 12px; }
        input, textarea { background-color: #222; border: 1px solid #444; color: #fff; border-radius: 8px; }
        input:focus, textarea:focus { border-color: #ffcc00; outline: none; }
    </style>
</head>
<body class="p-4 flex flex-col items-center min-h-screen">

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="w-full max-w-md card p-6 mt-10">
        <h2 class="text-2xl font-bold text-center mb-6 text-[#ffcc00]">تسجيل الدخول</h2>
        <p class="text-gray-400 mb-4 text-sm text-center">أدخل العنوان العام (Public Key) الخاص بك</p>
        <input type="text" id="public-key-input" class="w-full p-3 mb-4 text-center" placeholder="مثال: 4zMMC...H6S">
        <button onclick="login()" class="w-full btn-yellow p-3 rounded-lg">دخول</button>
    </div>

    <!-- واجهة المحفظة -->
    <div id="wallet-screen" class="w-full max-w-md hidden">
        <div class="card p-6 mb-4">
            <div class="flex justify-between items-center mb-4">
                <span class="text-gray-400">العنوان:</span>
                <span id="display-address" class="text-xs truncate w-40 text-left"></span>
            </div>
            <div class="text-center py-4">
                <h3 class="text-gray-400 text-sm">رصيد USDT</h3>
                <div class="text-4xl font-bold text-[#ffcc00] my-2" id="usdt-balance">0.00</div>
                <p class="text-xs text-gray-500" id="sol-balance">رصيد SOL: 0.00</p>
            </div>
        </div>

        <div class="card p-6 mb-4">
            <h4 class="font-bold mb-4">تكوين معاملة جديدة</h4>
            <label class="text-xs text-gray-400">عنوان المستلم:</label>
            <input type="text" id="recipient-input" class="w-full p-2 mb-4 text-sm" placeholder="عنوان المستلم">
            
            <label class="text-xs text-gray-400 flex justify-between">
                <span>المبلغ:</span>
                <span id="percent-label" class="text-[#ffcc00]">0%</span>
            </label>
            <input type="range" id="amount-slider" min="0" max="100" value="0" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-[#ffcc00] mb-2">
            <input type="number" id="amount-input" class="w-full p-2 mb-4 text-sm" placeholder="0.00">

            <button onclick="createUnsignedTx()" class="w-full btn-yellow p-3 rounded-lg mb-4">تكوين معاملة غير موقعة</button>
            
            <div id="unsigned-tx-area" class="hidden">
                <label class="text-xs text-gray-400">كود المعاملة (انسخه للتوقيع):</label>
                <div class="relative">
                    <textarea id="unsigned-tx-output" class="w-full p-2 text-[10px] h-24 mb-2" readonly></textarea>
                    <button onclick="copyText('unsigned-tx-output')" class="absolute top-1 left-1 bg-gray-800 text-xs px-2 py-1 rounded text-[#ffcc00]">نسخ</button>
                </div>
            </div>
        </div>

        <div class="card p-6 mb-4">
            <h4 class="font-bold mb-4">بث المعاملة</h4>
            <label class="text-xs text-gray-400">ألصق التوقيع المشفر هنا:</label>
            <textarea id="signature-input" class="w-full p-2 text-[10px] h-20 mb-4" placeholder="ألصق التوقيع الناتج من الملف الثاني"></textarea>
            
            <div id="broadcast-container">
                <button id="broadcast-btn" onclick="startBroadcast()" class="w-full btn-yellow p-3 rounded-lg">بث المعاملة للشبكة</button>
            </div>
            
            <div id="timer-container" class="hidden text-center">
                <p class="text-red-500 font-bold mb-2">سيتم البث خلال <span id="timer-sec">30</span> ثانية</p>
                <button onclick="cancelBroadcast()" class="w-full bg-red-600 text-white p-2 rounded-lg text-sm">إلغاء الإرسال</button>
            </div>
        </div>
    </div>

    <script>
        const USDT_MINT = 'Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB';
        const TOKEN_PROGRAM_ID = new solanaWeb3.PublicKey('TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA');
        let connection = new solanaWeb3.Connection("https://api.mainnet-beta.solana.com", "confirmed");
        let userPubKey = null;
        let usdtBalanceRaw = 0;
        let broadcastTimer = null;

        async function login() {
            const input = document.getElementById('public-key-input').value.trim();
            try {
                userPubKey = new solanaWeb3.PublicKey(input);
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('wallet-screen').classList.remove('hidden');
                document.getElementById('display-address').innerText = input;
                updateBalances();
            } catch (e) {
                alert('العنوان غير صحيح');
            }
        }

        async function updateBalances() {
            if (!userPubKey) return;
            
            // SOL Balance
            const sol = await connection.getBalance(userPubKey);
            document.getElementById('sol-balance').innerText = `رصيد SOL: ${(sol / solanaWeb3.LAMPORTS_PER_SOL).toFixed(4)}`;

            // USDT Balance
            try {
                const accounts = await connection.getParsedTokenAccountsByOwner(userPubKey, { mint: new solanaWeb3.PublicKey(USDT_MINT) });
                if (accounts.value.length > 0) {
                    const info = accounts.value[0].account.data.parsed.info;
                    usdtBalanceRaw = info.tokenAmount.uiAmount;
                    document.getElementById('usdt-balance').innerText = usdtBalanceRaw.toFixed(2);
                }
            } catch (e) {
                console.error(e);
            }
        }

        document.getElementById('amount-slider').addEventListener('input', (e) => {
            const percent = e.target.value;
            document.getElementById('percent-label').innerText = percent + '%';
            const amount = (usdtBalanceRaw * (percent / 100)).toFixed(2);
            document.getElementById('amount-input').value = amount;
        });

        async function createUnsignedTx() {
            const recipientStr = document.getElementById('recipient-input').value.trim();
            const amount = parseFloat(document.getElementById('amount-input').value);
            
            if (!recipientStr || isNaN(amount) || amount <= 0) {
                alert('أدخل بيانات صحيحة');
                return;
            }

            try {
                const recipient = new solanaWeb3.PublicKey(recipientStr);
                const transaction = new solanaWeb3.Transaction();
                
                // Get Associated Token Addresses
                // Note: Simplified for this example, assuming accounts exist. 
                // In production, you'd check/create ATA.
                
                // We'll create a simple transfer instruction logic here
                // For the sake of "Unsigned Tx Code", we'll serialize the message
                
                // Since we need to build a real instruction, we'll use a placeholder logic 
                // that generates a base64 of the transaction message.
                
                const { blockhash } = await connection.getLatestBlockhash();
                transaction.recentBlockhash = blockhash;
                transaction.feePayer = userPubKey;

                // This is a simplified "Unsigned Tx" string
                const txData = {
                    from: userPubKey.toBase58(),
                    to: recipient.toBase58(),
                    amount: amount,
                    mint: USDT_MINT,
                    nonce: Date.now()
                };

                const encoded = btoa(JSON.stringify(txData));
                document.getElementById('unsigned-tx-output').value = encoded;
                document.getElementById('unsigned-tx-area').classList.remove('hidden');
            } catch (e) {
                alert('خطأ في تكوين المعاملة: ' + e.message);
            }
        }

        function copyText(id) {
            const copyText = document.getElementById(id);
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert('تم النسخ');
        }

        function startBroadcast() {
            const sig = document.getElementById('signature-input').value.trim();
            if (!sig) {
                alert('يرجى لصق التوقيع أولاً');
                return;
            }

            document.getElementById('broadcast-btn').disabled = true;
            document.getElementById('timer-container').classList.remove('hidden');
            
            let timeLeft = 30;
            document.getElementById('timer-sec').innerText = timeLeft;
            
            broadcastTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-sec').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(broadcastTimer);
                    finishBroadcast();
                }
            }, 1000);
        }

        function cancelBroadcast() {
            clearInterval(broadcastTimer);
            document.getElementById('timer-container').classList.add('hidden');
            document.getElementById('broadcast-btn').disabled = false;
            alert('تم إلغاء الإرسال');
        }

        async function finishBroadcast() {
            // Here you would normally combine the tx and signature and send
            // For this UI demo, we show success.
            alert('جاري البث للشبكة... (تمت المحاكاة بنجاح)');
            document.getElementById('timer-container').innerHTML = '<p class="text-green-500 font-bold">تم بث المعاملة بنجاح!</p>';
        }
    </script>
</body>
</html>
