<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محفظة Tron - المتصلة</title>
    <script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.0/dist/TronWeb.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --primary-color: #FFD700;
            --text-color: #ffffff;
            --card-bg: #1a1a1a;
        }
        * {
            box-sizing: border-box;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 450px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.1);
        }
        h2 { 
            color: var(--primary-color); 
            text-align: center; 
            margin-top: 0;
            margin-bottom: 15px;
        }
        .balance-item {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            font-size: 1.1em;
            padding: 10px;
            background: #0a0a0a;
            border-radius: 8px;
        }
        .balance-value { 
            font-weight: bold; 
            color: var(--primary-color);
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #333;
            background: #222;
            color: white;
            box-sizing: border-box;
            font-size: 1em;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
        }
        .slider-container { 
            margin: 20px 0;
            padding: 15px;
            background: #0a0a0a;
            border-radius: 8px;
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 5px;
            outline: none;
            margin: 10px 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: var(--primary-color);
            border-radius: 50%;
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: var(--primary-color);
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            margin: 10px 0;
            transition: all 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
        }
        button:active { 
            transform: scale(0.98); 
        }
        button:disabled { 
            opacity: 0.5; 
            cursor: not-allowed; 
            transform: none;
        }
        .copy-btn {
            background: #333;
            color: var(--primary-color);
            padding: 8px 12px;
            font-size: 0.9em;
            width: auto;
            margin: 5px 0;
        }
        .status {
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
            display: none;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .timer {
            font-size: 1.8em;
            color: #ff4444;
            text-align: center;
            margin: 15px 0;
            display: none;
            font-weight: bold;
        }
        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            background: var(--primary-color);
            border-radius: 50%;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .node-info {
            font-size: 0.8em;
            color: #888;
            text-align: center;
            margin-top: 8px;
            padding: 8px;
            background: #0a0a0a;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card" id="loginSection">
        <h2>🔐 تسجيل الدخول</h2>
        <input type="text" id="publicAddress" placeholder="أدخل العنوان العام (T...)">
        <button onclick="login()">دخول</button>
    </div>

    <div id="mainSection" style="display:none;">
        <div class="card">
            <h2>💰 الرصيد</h2>
            <div class="balance-item">
                <span>TRX:</span>
                <span id="trxBalance" class="balance-value">
                    <span class="loading"></span>
                </span>
            </div>
            <div class="balance-item">
                <span>USDT:</span>
                <span id="usdtBalance" class="balance-value">
                    <span class="loading"></span>
                </span>
            </div>
            <button class="copy-btn" onclick="refreshBalances()">🔄 تحديث الرصيد</button>
            <div class="node-info" id="nodeInfo"></div>
        </div>

        <div class="card">
            <h2>📝 تكوين معاملة</h2>
            <select id="tokenType" onchange="updateAmountBySlider()">
                <option value="TRX">TRX</option>
                <option value="USDT">USDT (TRC20)</option>
            </select>
            <input type="text" id="recipient" placeholder="عنوان المستلم">
            <input type="number" id="amount" placeholder="الكمية" step="0.000001" oninput="updateSliderByAmount()">
            
            <div class="slider-container">
                <label>النسبة: <span id="percentLabel">0</span>%</label>
                <input type="range" id="percentSlider" min="0" max="100" value="0" oninput="updateAmountBySlider()">
            </div>

            <button onclick="createUnsignedTx()">✏️ تكوين معاملة غير موقعة</button>
        </div>

        <div class="card" id="unsignedTxCard" style="display:none;">
            <h2>📄 المعاملة غير الموقعة</h2>
            <textarea id="unsignedTxText" rows="6" readonly></textarea>
            <button class="copy-btn" onclick="copyText('unsignedTxText')">📋 نسخ المعاملة</button>
            <p style="font-size: 0.85em; color: #888;">انسخ هذا النص واذهب للملف الثاني لتوقيعه.</p>
        </div>

        <div class="card">
            <h2>🚀 بث المعاملة</h2>
            <textarea id="signedTxInput" placeholder="الصق التوقيع (المعاملة الموقعة) هنا" rows="6"></textarea>
            <div id="timerDisplay" class="timer">30</div>
            <button id="broadcastBtn" onclick="startBroadcastCountdown()">🌐 بث المعاملة للشبكة</button>
            <button id="cancelBtn" style="display:none; background: #ff4444; color: white;" onclick="cancelBroadcast()">❌ إلغاء البث</button>
        </div>

        <div class="card">
            <button class="copy-btn" onclick="logout()" style="background: #ff4444; color: white; width: 100%;">🚪 تسجيل الخروج</button>
        </div>
    </div>
    <div id="statusMsg" class="status"></div>
</div>

<script>
    // ====== إعدادات النظام ======
    const API_KEY = "4e8fc7a5-83ae-4f99-a98a-4b8f47e39551";
    const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
    
    // ====== متغيرات عامة ======
    let tronWeb;
    let userAddress = "";
    let balances = { TRX: 0, USDT: 0 };
    let broadcastTimeout;
    let countdownInterval;

    // ====== تهيئة TronWeb عند تحميل الصفحة ======
    window.addEventListener('load', () => {
        initTronWeb();
    });

    function initTronWeb() {
        try {
            tronWeb = new TronWeb({
                fullHost: 'https://api.trongrid.io',
                headers: { 'TRON-PRO-API-KEY': API_KEY }
            });
            console.log("✓ تم تهيئة المحفظة بنجاح");
            showStatus("✓ تم الاتصال بشبكة Tron", "success");
        } catch (e) {
            console.error("خطأ في تهيئة المحفظة:", e);
            showStatus("خطأ في تهيئة المحفظة", "error");
        }
    }

    async function login() {
        const addr = document.getElementById('publicAddress').value.trim();
        
        if (!tronWeb) {
            showStatus("لم يتم تهيئة المحفظة بعد", "error");
            return;
        }
        
        if (tronWeb.isAddress(addr)) {
            userAddress = addr;
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('mainSection').style.display = 'block';
            refreshBalances();
        } else {
            showStatus("عنوان غير صحيح", "error");
        }
    }

    async function refreshBalances() {
        try {
            document.getElementById('trxBalance').innerHTML = '<span class="loading"></span>';
            document.getElementById('usdtBalance').innerHTML = '<span class="loading"></span>';
            
            // جلب رصيد TRX
            try {
                const trxBalanceSun = await tronWeb.trx.getBalance(userAddress);
                balances.TRX = trxBalanceSun / 1000000;
                document.getElementById('trxBalance').innerText = balances.TRX.toFixed(4);
            } catch (e) {
                console.error("خطأ في جلب TRX:", e);
                document.getElementById('trxBalance').innerText = "خطأ";
            }

            // جلب رصيد USDT
            try {
                const contract = await tronWeb.contract().at(USDT_CONTRACT);
                const usdtBalanceRaw = await contract.balanceOf(userAddress).call();
                balances.USDT = parseInt(usdtBalanceRaw._hex || usdtBalanceRaw) / 1000000;
                document.getElementById('usdtBalance').innerText = balances.USDT.toFixed(2);
            } catch (e) {
                console.error("خطأ في جلب USDT:", e);
                document.getElementById('usdtBalance').innerText = "خطأ";
            }
            
            document.getElementById('nodeInfo').innerText = "✓ متصل بشبكة Tron";
            showStatus("تم تحديث الرصيد بنجاح", "success");
        } catch (e) {
            console.error("خطأ عام:", e);
            showStatus("خطأ في جلب الرصيد", "error");
        }
    }

    function updateAmountBySlider() {
        const percent = document.getElementById('percentSlider').value;
        const type = document.getElementById('tokenType').value;
        document.getElementById('percentLabel').innerText = percent;
        
        const max = balances[type];
        const amount = (max * (percent / 100)).toFixed(type === 'TRX' ? 6 : 2);
        document.getElementById('amount').value = amount;
    }

    function updateSliderByAmount() {
        const amount = parseFloat(document.getElementById('amount').value) || 0;
        const type = document.getElementById('tokenType').value;
        const max = balances[type];
        if (max > 0) {
            const percent = Math.min(100, Math.max(0, (amount / max) * 100));
            document.getElementById('percentSlider').value = percent;
            document.getElementById('percentLabel').innerText = Math.round(percent);
        }
    }

    async function createUnsignedTx() {
        const recipient = document.getElementById('recipient').value.trim();
        const amount = document.getElementById('amount').value;
        const type = document.getElementById('tokenType').value;

        if (!tronWeb.isAddress(recipient)) return showStatus("عنوان المستلم غير صحيح", "error");
        if (amount <= 0) return showStatus("أدخل كمية صحيحة", "error");

        try {
            let transaction;
            if (type === 'TRX') {
                transaction = await tronWeb.transactionBuilder.sendTrx(recipient, tronWeb.toSun(amount), userAddress);
            } else {
                const options = {};
                const parameter = [
                    { type: 'address', value: recipient },
                    { type: 'uint256', value: (amount * 1000000).toString() }
                ];
                transaction = await tronWeb.transactionBuilder.triggerSmartContract(
                    USDT_CONTRACT, 'transfer(address,uint256)', options, parameter, userAddress
                );
                transaction = transaction.transaction;
            }

            document.getElementById('unsignedTxText').value = JSON.stringify(transaction);
            document.getElementById('unsignedTxCard').style.display = 'block';
            showStatus("تم تكوين المعاملة بنجاح", "success");
        } catch (e) {
            showStatus("فشل تكوين المعاملة: " + e.message, "error");
        }
    }

    function startBroadcastCountdown() {
        const signedTxStr = document.getElementById('signedTxInput').value.trim();
        if (!signedTxStr) return showStatus("يرجى لصق التوقيع أولاً", "error");

        let timeLeft = 30;
        const timerDisplay = document.getElementById('timerDisplay');
        const broadcastBtn = document.getElementById('broadcastBtn');
        const cancelBtn = document.getElementById('cancelBtn');

        timerDisplay.style.display = 'block';
        timerDisplay.innerText = timeLeft;
        broadcastBtn.disabled = true;
        cancelBtn.style.display = 'block';

        countdownInterval = setInterval(() => {
            timeLeft--;
            timerDisplay.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                broadcastTransaction();
            }
        }, 1000);
    }

    function cancelBroadcast() {
        clearInterval(countdownInterval);
        clearTimeout(broadcastTimeout);
        document.getElementById('timerDisplay').style.display = 'none';
        document.getElementById('broadcastBtn').disabled = false;
        document.getElementById('cancelBtn').style.display = 'none';
        showStatus("تم إلغاء البث", "info");
    }

    async function broadcastTransaction() {
        const signedTxStr = document.getElementById('signedTxInput').value.trim();
        try {
            const signedTx = JSON.parse(signedTxStr);
            const result = await tronWeb.trx.sendRawTransaction(signedTx);
            if (result.result) {
                showStatus("تم بث المعاملة بنجاح! Hash: " + result.txid, "success");
            } else {
                showStatus("فشل البث: " + JSON.stringify(result), "error");
            }
        } catch (e) {
            showStatus("خطأ في البيانات الموقعة: " + e.message, "error");
        }
        cancelBroadcast();
    }

    function copyText(id) {
        const copyText = document.getElementById(id);
        copyText.select();
        document.execCommand("copy");
        alert("تم النسخ!");
    }

    function showStatus(msg, type) {
        const status = document.getElementById('statusMsg');
        status.innerText = msg;
        status.style.display = 'block';
        status.style.backgroundColor = type === 'success' ? '#2e7d32' : (type === 'error' ? '#c62828' : '#333');
        setTimeout(() => status.style.display = 'none', 5000);
    }

    function logout() {
        document.getElementById('mainSection').style.display = 'none';
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('publicAddress').value = '';
        userAddress = '';
    }
</script>
</body>
</html>
