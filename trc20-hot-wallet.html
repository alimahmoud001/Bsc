<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محفظة TRON - البث المتصل</title>
    
    <script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.0/dist/TronWeb.js"></script>
    <script>
        // تعريف Buffer محلي وقوي جداً لضمان عمل TronWeb
        (function() {
            if (typeof window.Buffer === 'undefined') {
                // محاكاة Buffer بسيطة وفعالة لما تحتاجه TronWeb
                window.Buffer = function(data, enc) { return new Uint8Array(data); };
                window.Buffer.from = function(data, enc) {
                    if (typeof data === 'string') {
                        return new TextEncoder().encode(data);
                    }
                    return new Uint8Array(data);
                };
                window.Buffer.isBuffer = function(obj) { return obj instanceof Uint8Array; };
                window.Buffer.alloc = function(size) { return new Uint8Array(size); };
            }
        })();
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: sans-serif; padding: 10px; }
        .container { max-width: 500px; margin: 0 auto; background: #0a0a0a; border: 2px solid #ffd700; border-radius: 15px; padding: 20px; }
        h1 { text-align: center; color: #ffd700; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; color: #ffd700; margin-bottom: 8px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; border: 2px solid #ffd700; background: #1a1a1a; color: #fff; border-radius: 8px; }
        button { width: 100%; padding: 12px; background: #ffd700; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .balance-display { background: #1a1a1a; border: 2px solid #ffd700; border-radius: 8px; padding: 15px; margin-bottom: 15px; text-align: center; }
        .balance-value { color: #00ff00; font-size: 18px; font-weight: bold; }
        .slider-container { margin: 20px 0; }
        .amount-display { background: #1a1a1a; border: 2px solid #ffd700; border-radius: 8px; padding: 10px; text-align: center; color: #00ff00; font-weight: bold; }
        .transaction-output { background: #1a1a1a; border: 2px solid #ffd700; border-radius: 8px; padding: 15px; margin: 15px 0; max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px; word-break: break-all; }
        .copy-btn { background: #00ff00; color: #000; padding: 8px 15px; margin-top: 10px; }
        .status-message { padding: 10px; border-radius: 8px; margin: 10px 0; text-align: center; font-weight: bold; }
        .status-success { background: #0a3a0a; color: #00ff00; border: 2px solid #00ff00; }
        .status-error { background: #3a0a0a; color: #ff0000; border: 2px solid #ff0000; }
        .debug-log { background: #0a0a0a; border: 1px solid #444; padding: 10px; margin-top: 15px; max-height: 150px; overflow-y: auto; font-size: 11px; color: #888; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 محفظة TRON</h1>
        
        <div id="loginSection">
            <div class="input-group">
                <label>عنوان المحفظة:</label>
                <input type="text" id="walletAddress" placeholder="T...">
            </div>
            <button onclick="login()">تسجيل الدخول</button>
        </div>
        
        <div id="walletSection" class="hidden">
            <div class="balance-display">
                <div>TRX: <span id="trxBalance" class="balance-value">0.00</span></div>
                <div>USDT: <span id="usdtBalance" class="balance-value">0.00</span></div>
            </div>
            
            <div class="input-group">
                <label>العملة:</label>
                <select id="currencyType" onchange="updateDisplay()">
                    <option value="TRX">TRX</option>
                    <option value="USDT">USDT</option>
                </select>
            </div>
            
            <div class="slider-container">
                <div style="display:flex; justify-content:space-between; color:#ffd700;">
                    <span>النسبة:</span><span id="percentDisplay">0%</span>
                </div>
                <input type="range" id="amountSlider" min="0" max="100" value="0" oninput="updateDisplay()" style="width:100%;">
                <div id="amountDisplay" class="amount-display">0.00</div>
            </div>
            
            <div class="input-group">
                <label>المستقبل:</label>
                <input type="text" id="recipientAddress" placeholder="T...">
            </div>
            
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <button onclick="createTransaction()">تكوين المعاملة</button>
                <button onclick="location.reload()" style="background:#ff6b6b;">خروج</button>
            </div>
            
            <div id="statusMessage"></div>
            
            <div id="unsignedTxSection" class="hidden">
                <div id="unsignedTx" class="transaction-output"></div>
                <button class="copy-btn" onclick="copyTx()">📋 نسخ</button>
            </div>
            
            <div id="signatureSection" class="hidden">
                <input type="text" id="signatureInput" placeholder="الصق التوقيع هنا..." style="margin-top:15px;">
                <button onclick="broadcast()" style="background:#00ff00; margin-top:10px;">بث المعاملة</button>
                <div id="countdown" style="color:red; text-align:center; margin-top:10px;"></div>
            </div>
        </div>
        
        <div id="debugLog" class="debug-log"></div>
    </div>

    <script>
        const USDT_CONTRACT = 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t';
        let tronWeb, currentAddress, balances = { TRX: 0, USDT: 0 }, currentTx;

        function log(m) {
            const d = document.getElementById('debugLog');
            d.innerHTML += `<div>> ${m}</div>`;
            d.scrollTop = d.scrollHeight;
        }

        function showStatus(m, type) {
            const s = document.getElementById('statusMessage');
            s.textContent = m;
            s.className = 'status-message status-' + type;
        }

        async function login() {
            const addr = document.getElementById('walletAddress').value.trim();
            if (!addr) return;
            log('جاري التهيئة...');
            tronWeb = new TronWeb({ fullHost: 'https://api.trongrid.io' });
            if (!tronWeb.isAddress(addr)) return showStatus('عنوان خطأ', 'error');
            currentAddress = addr;
            await fetchBalances();
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('walletSection').classList.remove('hidden');
            showStatus('تم الدخول', 'success');
        }

        async function fetchBalances() {
            log('جلب الأرصدة...');
            try {
                const trx = await tronWeb.trx.getBalance(currentAddress);
                balances.TRX = trx / 1e6;
                document.getElementById('trxBalance').textContent = balances.TRX.toFixed(6);
                
                const res = await fetch(`https://api.trongrid.io/v1/accounts/${currentAddress}`);
                const data = await res.json();
                balances.USDT = 0;
                if (data.data && data.data[0]) {
                    const acc = data.data[0];
                    if (acc.trc20) {
                        acc.trc20.forEach(t => {
                            if (Object.keys(t)[0] === USDT_CONTRACT) balances.USDT = t[USDT_CONTRACT] / 1e6;
                        });
                    }
                    if (balances.USDT === 0 && acc.asset_v2) {
                        acc.asset_v2.forEach(a => {
                            if (a.key === USDT_CONTRACT) balances.USDT = a.value / 1e6;
                        });
                    }
                }
                document.getElementById('usdtBalance').textContent = balances.USDT.toFixed(6);
                log(`TRX: ${balances.TRX}, USDT: ${balances.USDT}`);
                updateDisplay();
            } catch(e) { log('خطأ أرصدة: ' + e.message); }
        }

        function updateDisplay() {
            const cur = document.getElementById('currencyType').value;
            const per = document.getElementById('amountSlider').value;
            const amt = (balances[cur] * per) / 100;
            document.getElementById('percentDisplay').textContent = per + '%';
            document.getElementById('amountDisplay').textContent = amt.toFixed(6) + ' ' + cur;
        }

        async function createTransaction() {
            const cur = document.getElementById('currencyType').value;
            const per = document.getElementById('amountSlider').value;
            const rec = document.getElementById('recipientAddress').value.trim();
            if (!rec || per == 0) return showStatus('بيانات ناقصة', 'error');
            const amt = Math.floor((balances[cur] * per / 100) * 1e6);
            log(`تكوين معاملة ${cur}...`);
            try {
                if (cur === 'TRX') {
                    currentTx = await tronWeb.transactionBuilder.sendTrx(rec, amt, currentAddress);
                } else {
                    log('تكوين USDT...');
                    const toHex = tronWeb.address.toHex(rec);
                    const tx = await tronWeb.transactionBuilder.triggerSmartContract(
                        USDT_CONTRACT, 'transfer(address,uint256)', { feeLimit: 1e8 },
                        [{type:'address',value:toHex}, {type:'uint256',value:amt}], currentAddress
                    );
                    currentTx = tx.transaction;
                }
                document.getElementById('unsignedTx').textContent = JSON.stringify(currentTx, null, 2);
                document.getElementById('unsignedTxSection').classList.remove('hidden');
                document.getElementById('signatureSection').classList.remove('hidden');
                showStatus('نجح التكوين', 'success');
            } catch(e) { showStatus('فشل: ' + e.message, 'error'); log(e.message); }
        }

        function copyTx() {
            navigator.clipboard.writeText(document.getElementById('unsignedTx').textContent);
            showStatus('تم النسخ', 'success');
        }

        function broadcast() {
            const sig = document.getElementById('signatureInput').value.trim();
            if (!sig) return;
            let c = 30;
            const timer = setInterval(async () => {
                document.getElementById('countdown').textContent = `بث خلال ${c} ثانية...`;
                if (c <= 0) {
                    clearInterval(timer);
                    currentTx.signature = [sig];
                    const res = await tronWeb.trx.sendRawTransaction(currentTx);
                    if (res.result) showStatus('نجح البث! ID: ' + res.txid, 'success');
                    else showStatus('فشل البث: ' + res.message, 'error');
                }
                c--;
            }, 1000);
        }
    </script>
</body>
</html>
