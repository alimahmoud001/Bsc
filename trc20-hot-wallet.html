
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محفظة Tron - النسخة المستقرة</title>
    <script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.0/dist/TronWeb.js"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #111;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.1);
        }
        h2 { color: #ffd700; text-align: center; margin-bottom: 20px; }
        .section { margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        label { display: block; margin-bottom: 8px; color: #aaa; font-size: 0.9em; }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #222;
            color: #fff;
            box-sizing: border-box;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background-color: #ffd700;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
        }
        .btn:disabled { background-color: #555; cursor: not-allowed; }
        .btn-copy { background-color: #444; color: #ffd700; margin-top: 5px; padding: 8px; font-size: 0.8em; }
        .balance-card {
            background: #222;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-right: 4px solid #ffd700;
        }
        .balance-item { display: flex; justify-content: space-between; margin: 5px 0; }
        .slider-container { margin: 20px 0; }
        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #333;
            outline: none;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ffd700;
            cursor: pointer;
        }
        .status { font-size: 0.85em; margin-top: 10px; text-align: center; min-height: 1.2em; }
        .hidden { display: none; }
        #countdown { color: #ff4444; font-weight: bold; font-size: 1.2em; }
        .api-check { font-size: 0.7em; color: #888; text-align: center; margin-bottom: 10px; }
        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,215,0,.3);
            border-radius: 50%;
            border-top-color: #ffd700;
            animation: spin 1s linear infinite;
            vertical-align: middle;
            margin-left: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h2>محفظة Tron الذكية</h2>
    <div id="api-status" class="api-check">جاري فحص اتصال API...</div>

    <!-- Login Section -->
    <div id="login-section" class="section">
        <label>أدخل عنوان المحفظة (Public Address):</label>
        <input type="text" id="wallet-address" placeholder="T..." value="">
        <button id="login-btn" class="btn" onclick="login()">تسجيل الدخول</button>
    </div>

    <!-- Wallet Info Section -->
    <div id="wallet-info" class="section hidden">
        <div class="balance-card">
            <div class="balance-item"><span>TRX:</span> <span id="trx-balance">0.00</span></div>
            <div class="balance-item"><span>USDT:</span> <span id="usdt-balance">0.00</span></div>
        </div>
        
        <label>نوع العملة:</label>
        <select id="asset-type" onchange="updateAmountBySlider()">
            <option value="TRX">TRX</option>
            <option value="USDT">USDT (TRC20)</option>
        </select>

        <label>عنوان المستلم:</label>
        <input type="text" id="recipient-address" placeholder="T...">

        <div class="slider-container">
            <label>النسبة من الرصيد: <span id="percent-label">0%</span></label>
            <input type="range" min="0" max="100" value="0" class="slider" id="amount-slider" oninput="updateAmountBySlider()">
        </div>

        <label>المبلغ:</label>
        <input type="number" id="send-amount" placeholder="0.00" step="any">

        <button id="create-tx-btn" class="btn" onclick="createUnsignedTx()">تكوين معاملة غير موقعة</button>
    </div>

    <!-- Unsigned Tx Section -->
    <div id="unsigned-section" class="section hidden">
        <label>كود المعاملة غير الموقعة:</label>
        <textarea id="unsigned-tx-data" rows="4" readonly></textarea>
        <button class="btn btn-copy" onclick="copyToClipboard('unsigned-tx-data')">نسخ كود المعاملة</button>
    </div>

    <!-- Broadcast Section -->
    <div id="broadcast-section" class="section hidden">
        <label>أدخل التوقيع المستلم (Signature):</label>
        <textarea id="signature-input" rows="3" placeholder="الصق التوقيع هنا..."></textarea>
        
        <div id="timer-container" class="hidden">
            <p>سيتم البث خلال: <span id="countdown">30</span> ثانية</p>
            <button class="btn" style="background: #ff4444; color: #fff;" onclick="cancelBroadcast()">إلغاء البث</button>
        </div>
        
        <button id="broadcast-btn" class="btn" onclick="startBroadcastTimer()">بث المعاملة للشبكة</button>
    </div>

    <div id="status-msg" class="status"></div>
</div>

<script>
    const API_KEY = '4e8fc7a5-83ae-4f99-a98a-4b8f47e39551';
    const USDT_CONTRACT = 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t';
    
    let tronWeb;
    let currentAddress = '';
    let balances = { TRX: 0, USDT: 0 };
    let currentUnsignedTx = null;
    let broadcastTimer = null;

    // تهيئة قوية لـ TronWeb تضمن تمرير المفتاح في كل مكان
    function setupTronWeb() {
        const HttpProvider = TronWeb.providers.HttpProvider;
        const fullNode = new HttpProvider('https://api.trongrid.io');
        const solidityNode = new HttpProvider('https://api.trongrid.io');
        const eventServer = new HttpProvider('https://api.trongrid.io');

        // حقن المفتاح في الرؤوس الافتراضية لكل مزود
        [fullNode, solidityNode, eventServer].forEach(provider => {
            provider.headers = { "TRON-PRO-API-KEY": API_KEY };
        });

        tronWeb = new TronWeb(fullNode, solidityNode, eventServer);
    }

    async function checkApiHealth() {
        try {
            const status = await tronWeb.fullNode.request('wallet/getnodeinfo', {}, 'post');
            document.getElementById('api-status').innerHTML = '✅ اتصال API نشط ومصرح به';
            document.getElementById('api-status').style.color = '#00ff00';
        } catch (e) {
            console.error('API Check Failed:', e);
            document.getElementById('api-status').innerHTML = '❌ خطأ في API (401): المفتاح غير مفعل أو مقيد';
            document.getElementById('api-status').style.color = '#ff4444';
        }
    }

    window.onload = function() {
        setupTronWeb();
        checkApiHealth();
    };

    async function login() {
        const addr = document.getElementById('wallet-address').value.trim();
        if (!tronWeb.isAddress(addr)) return alert('عنوان غير صحيح');
        
        currentAddress = addr;
        const btn = document.getElementById('login-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="loading-spinner"></span> جاري الدخول...';
        
        try {
            await updateBalances();
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('wallet-info').classList.remove('hidden');
            document.getElementById('broadcast-section').classList.remove('hidden');
            showStatus('تم تسجيل الدخول', '#ffd700');
        } catch (e) {
            alert('فشل جلب البيانات. تأكد من أن مفتاح API يعمل (401).');
            btn.disabled = false;
            btn.innerText = 'تسجيل الدخول';
        }
    }

    async function updateBalances() {
        // TRX
        const trxSun = await tronWeb.trx.getBalance(currentAddress);
        balances.TRX = tronWeb.fromSun(trxSun);
        document.getElementById('trx-balance').innerText = balances.TRX + ' TRX';

        // USDT
        try {
            const contract = await tronWeb.contract().at(USDT_CONTRACT);
            const usdtRaw = await contract.balanceOf(currentAddress).call();
            const usdtValue = usdtRaw.toNumber ? usdtRaw.toNumber() : usdtRaw;
            balances.USDT = usdtValue / 1e6;
            document.getElementById('usdt-balance').innerText = balances.USDT.toFixed(2) + ' USDT';
        } catch (e) {
            document.getElementById('usdt-balance').innerText = '0.00 USDT';
        }
    }

    function updateAmountBySlider() {
        const percent = document.getElementById('amount-slider').value;
        document.getElementById('percent-label').innerText = percent + '%';
        const type = document.getElementById('asset-type').value;
        const amount = (balances[type] * (percent / 100)).toFixed(6);
        document.getElementById('send-amount').value = amount;
    }

    async function createUnsignedTx() {
        const recipient = document.getElementById('recipient-address').value.trim();
        const amount = document.getElementById('send-amount').value;
        const type = document.getElementById('asset-type').value;

        if (!tronWeb.isAddress(recipient) || amount <= 0) return alert('بيانات غير صحيحة');

        const btn = document.getElementById('create-tx-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="loading-spinner"></span> جاري التكوين...';

        try {
            let tx;
            if (type === 'TRX') {
                tx = await tronWeb.transactionBuilder.sendTrx(recipient, tronWeb.toSun(amount), currentAddress);
            } else {
                const trigger = await tronWeb.transactionBuilder.triggerSmartContract(
                    USDT_CONTRACT, 'transfer(address,uint256)', {},
                    [{type:'address',value:recipient},{type:'uint256',value:Math.floor(amount*1e6)}],
                    currentAddress
                );
                tx = trigger.transaction;
            }
            currentUnsignedTx = tx;
            document.getElementById('unsigned-tx-data').value = JSON.stringify(tx);
            document.getElementById('unsigned-section').classList.remove('hidden');
            showStatus('تم تكوين المعاملة', '#ffd700');
        } catch (e) {
            alert('خطأ: ' + e.message);
        } finally {
            btn.disabled = false;
            btn.innerText = 'تكوين معاملة غير موقعة';
        }
    }

    function startBroadcastTimer() {
        const sig = document.getElementById('signature-input').value.trim();
        if (!sig || !currentUnsignedTx) return alert('يرجى إدخال التوقيع');

        document.getElementById('broadcast-btn').classList.add('hidden');
        document.getElementById('timer-container').classList.remove('hidden');
        
        let timeLeft = 30;
        document.getElementById('countdown').innerText = timeLeft;

        broadcastTimer = setInterval(async () => {
            timeLeft--;
            document.getElementById('countdown').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(broadcastTimer);
                await broadcastTransaction(sig);
            }
        }, 1000);
    }

    function cancelBroadcast() {
        clearInterval(broadcastTimer);
        document.getElementById('timer-container').classList.add('hidden');
        document.getElementById('broadcast-btn').classList.remove('hidden');
        showStatus('تم إلغاء البث', '#ff4444');
    }

    async function broadcastTransaction(signature) {
        try {
            const signedTx = JSON.parse(JSON.stringify(currentUnsignedTx));
            if (!signedTx.signature) signedTx.signature = [];
            signedTx.signature.push(signature);

            const receipt = await tronWeb.trx.sendRawTransaction(signedTx);
            if (receipt.result) {
                showStatus('تم البث بنجاح! ID: ' + receipt.txid, '#00ff00');
                alert('تم البث بنجاح!');
            } else {
                throw new Error(JSON.stringify(receipt));
            }
        } catch (e) {
            showStatus('فشل البث: ' + e.message, '#ff4444');
            cancelBroadcast();
        }
    }

    function copyToClipboard(id) {
        const el = document.getElementById(id);
        el.select();
        document.execCommand("copy");
        showStatus('تم النسخ', '#ffd700');
    }

    function showStatus(msg, color) {
        const el = document.getElementById('status-msg');
        el.innerText = msg;
        el.style.color = color;
    }
</script>

</body>
</html>
