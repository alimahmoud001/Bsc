<!DOCTYPE html>

    <title>محفظة TRON - البث المتصل</title>
    
    <!-- تعريف Buffer -->
    <script>
        if (typeof Buffer === 'undefined') {
            window.Buffer = {
                isBuffer: (obj) => obj != null && (obj._isBuffer === true || obj instanceof Uint8Array),
                from: (data) => {
                    if (typeof data === 'string') {
                        const bytes = new Uint8Array(data.length);
                        for (let i = 0; i < data.length; i++) bytes[i] = data.charCodeAt(i);
                        return bytes;
                    }
                    return new Uint8Array(data);
                },
                alloc: (size) => new Uint8Array(size),
                allocUnsafe: (size) => new Uint8Array(size),
                concat: (list) => {
                    let totalLength = 0;
                    for (let i = 0; i < list.length; i++) totalLength += list[i].length;
                    const result = new Uint8Array(totalLength);
                    let offset = 0;
                    for (let i = 0; i < list.length; i++) {
                        result.set(list[i], offset);
                        offset += list[i].length;
                    }
                    return result;
                }
            };
        } else if (!Buffer.from) {
            Buffer.from = (data) => {
                if (typeof data === 'string') {
                    const bytes = new Uint8Array(data.length);
                    for (let i = 0; i < data.length; i++) bytes[i] = data.charCodeAt(i);
                    return bytes;
                }
                return new Uint8Array(data);
            };
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.0/dist/TronWeb.js"></script>
    
    <style>

        @media (max-width: 480px) {

<body>

<div class="container">
    <h1>💰 محفظة TRON</h1>
    
    <!-- قسم تسجيل الدخول -->
    <div class="login-section" id="loginSection">
        <div class="input-group">
            <label>أدخل عنوان المحفظة:</label>
            <input type="text" id="walletAddress" placeholder="T..." autocomplete="off">
        </div>
        <button class="btn" onclick="loginWallet()">تسجيل الدخول</button>
    </div>
    
    <!-- قسم المحفظة -->
    <div class="wallet-section" id="walletSection">
        <!-- عرض الأرصدة -->
        <div class="balance-box">
            <div class="balance-item">
                <span class="balance-label">رصيد TRX:</span>
                <span class="balance-value" id="trxBalance">0.00</span>
            </div>
            <div class="balance-item">
                <span class="balance-label">رصيد USDT:</span>
                <span class="balance-value" id="usdtBalance">0.00</span>
            </div>
        </div>
        
        <!-- اختيار العملة -->
        <div class="input-group">
            <label>اختر العملة:</label>
            <select class="currency-selector" id="currencyType" onchange="updateDisplay()">
                <option value="TRX">TRX - Tron</option>
                <option value="USDT">USDT - TRC20</option>
            </select>
        </div>
        
        <!-- مؤشر النسبة المئوية -->
        <div class="slider-container">
            <div class="slider-label">
                <span>النسبة المئوية:</span>
                <span id="percentDisplay">0%</span>
            </div>
            <input type="range" class="slider" id="amountSlider" min="0" max="100" value="0" oninput="updateDisplay()">
        </div>
        
        <!-- عرض المبلغ -->
        <div class="amount-display" id="amountDisplay">0.00</div>
        
        <!-- عنوان المستقبل -->
        <div class="input-group">
            <label>عنوان المستقبل:</label>
            <input type="text" class="recipient-input" id="recipientAddress" placeholder="T..." autocomplete="off">
        </div>
        
        <!-- زر تكوين المعاملة -->
        <button class="btn" onclick="createTransaction()">تكوين المعاملة</button>
        
        <!-- عرض المعاملة غير الموقعة -->
        <div class="input-group" id="txOutputSection" style="display: none;">
            <label>المعاملة غير الموقعة (JSON):</label>
            <div class="tx-output" id="txOutput"></div>
            <button class="copy-btn" onclick="copyToClipboard('txOutput')">📋 نسخ المعاملة</button>
        </div>
        
        <!-- إدخال التوقيع -->
        <div class="input-group" id="signatureSection" style="display: none;">
            <label>التوقيع (من الملف الثاني):</label>
            <textarea class="signature-input" id="signatureInput" placeholder="الصق التوقيع هنا..."></textarea>
        </div>
        
        <!-- قسم المؤقت -->
        <div class="timer-section" id="timerSection">
            <div class="timer-text">سيتم البث خلال:</div>
            <div class="timer-countdown" id="timerCountdown">30</div>
            <button class="cancel-btn" onclick="cancelBroadcast()">إلغاء البث</button>
        </div>
        
        <!-- زر البث -->
        <button class="btn" id="broadcastBtn" onclick="startBroadcast()" style="display: none;">بث المعاملة</button>
        
        <!-- رسالة الحالة -->
        <div class="status-message" id="statusMessage"></div>
        
        <!-- زر تسجيل الخروج -->
        <button class="btn" style="background: #666; margin-top: 20px;" onclick="logout()">تسجيل الخروج</button>
        
        <!-- سجل التشخيص -->
        <div id="debugLog" style="background: #000; border: 1px solid #333; padding: 10px; margin-top: 20px; border-radius: 8px; font-size: 11px; color: #888; max-height: 150px; overflow-y: auto; font-family: monospace; line-height: 1.4;"></div>
    </div>
</div>

<script>
    let tronWeb;
    let currentAddress = '';
    let balances = { TRX: 0, USDT: 0 };
    let currentTx = null;
    let broadcastTimer = null;
    
    const USDT_CONTRACT = 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t';
    const API_KEY = '4e8fc7a5-83ae-4f99-a98a-4b8f47e39551';
    
    function logDebug(msg) {
        const debugLog = document.getElementById('debugLog');
        if (debugLog) {
            debugLog.innerHTML += msg + '<br>';
            debugLog.scrollTop = debugLog.scrollHeight;
        }
        console.log(msg);
    }
    
    async function initTronWeb() {
        try {
            logDebug('🔧 بدء تهيئة TronWeb...');
            const HttpProvider = TronWeb.providers.HttpProvider;
            const fullNode = new HttpProvider('https://api.trongrid.io');
            const solidityNode = new HttpProvider('https://api.trongrid.io');
            const eventServer = new HttpProvider('https://api.trongrid.io');
            
            [fullNode, solidityNode, eventServer].forEach(provider => {
                provider.headers = { "TRON-PRO-API-KEY": API_KEY };
            });
            
            tronWeb = new TronWeb(fullNode, solidityNode, eventServer);
            logDebug('✅ تمت تهيئة TronWeb بنجاح');
        } catch (e) {
            logDebug('❌ خطأ في تهيئة TronWeb: ' + e.message);
            console.error('خطأ في تهيئة TronWeb:', e);
        }
    }
    
    window.onload = () => {
        logDebug('📱 جاري تحميل الصفحة...');
        initTronWeb();
        setTimeout(() => {
            if (!tronWeb) {
                logDebug('⚠️ تحذير: TronWeb لم يتم تحميله بعد');
            }
        }, 2000);
    };
    
    async function loginWallet() {
        const addr = document.getElementById('walletAddress').value.trim();
        
        logDebug('🔐 محاولة تسجيل الدخول للعنوان: ' + addr);
        
        if (!addr) {
            logDebug('❌ خطأ: لم يتم إدخال عنوان');
            showStatus('يرجى إدخال عنوان المحفظة', 'error');
            return;
        }
        
        if (!tronWeb) {
            logDebug('❌ خطأ: TronWeb لم يتم تحميله');
            showStatus('خطأ: المكتبات لم تحمل بعد. حاول مجدداً', 'error');
            return;
        }
        
        if (!tronWeb.isAddress(addr)) {
            logDebug('❌ خطأ: عنوان غير صحيح');
            showStatus('عنوان المحفظة غير صحيح', 'error');
            return;
        }
        
        currentAddress = addr;
        logDebug('✓ العنوان صحيح');
        
        try {
            logDebug('⏳ جاري جلب الأرصدة...');
            await fetchBalances();
            logDebug('✅ تم جلب الأرصدة بنجاح');
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('walletSection').classList.add('active');
            showStatus('تم تسجيل الدخول بنجاح', 'success');
        } catch (e) {
            logDebug('❌ خطأ في جلب البيانات: ' + e.message);
            showStatus('فشل جلب البيانات: ' + e.message, 'error');
        }
    }
    
    async function fetchBalances() {
        try {
            // جلب TRX
            logDebug('💰 جاري جلب رصيد TRX...');
            const trxSun = await tronWeb.trx.getBalance(currentAddress);
            let trxValue = tronWeb.fromSun(trxSun);
            // تحويل إلى رقم عادي
            if (typeof trxValue === 'object' && trxValue.toNumber) {
                balances.TRX = trxValue.toNumber();
            } else if (typeof trxValue === 'object' && trxValue.toString) {
                balances.TRX = parseFloat(trxValue.toString());
            } else {
                balances.TRX = parseFloat(trxValue);
            }
            logDebug('✅ رصيد TRX: ' + balances.TRX);
            
            // جلب USDT
            logDebug('💰 جاري جلب رصيد USDT...');
            try {
                // محاولة 1: استخدام contract().at()
                try {
                    const contract = await tronWeb.contract().at(USDT_CONTRACT);
                    const usdtRaw = await contract.balanceOf(currentAddress).call();
                    let usdtValue = 0;
                    
                    if (usdtRaw && typeof usdtRaw === 'object') {
                        if (usdtRaw.toNumber && typeof usdtRaw.toNumber === 'function') {
                            usdtValue = usdtRaw.toNumber();
                        } else if (usdtRaw._hex) {
                            usdtValue = parseInt(usdtRaw._hex, 16);
                        } else if (usdtRaw.toString && typeof usdtRaw.toString === 'function') {
                            usdtValue = parseInt(usdtRaw.toString());
                        } else {
                            usdtValue = parseInt(usdtRaw);
                        }
                    } else if (typeof usdtRaw === 'number') {
                        usdtValue = usdtRaw;
                    } else if (typeof usdtRaw === 'string') {
                        usdtValue = parseInt(usdtRaw);
                    }
                    
                    balances.USDT = Math.max(0, usdtValue / 1e6);
                    logDebug('✅ رصيد USDT: ' + balances.USDT);
                } catch (contractError) {
                    logDebug('⚠️ طريقة 1 فشلت: ' + contractError.message);
                    // محاولة 2: استخدام API مباشر
                    try {
                        const response = await fetch('https://api.trongrid.io/v1/accounts/' + currentAddress, {
                            headers: { 'TRON-PRO-API-KEY': API_KEY }
                        });
                        if (response.ok) {
                            const data = await response.json();
                            if (data.data && data.data[0] && data.data[0].trc20) {
                                const usdtData = data.data[0].trc20.find(t => t[USDT_CONTRACT]);
                                if (usdtData && usdtData[USDT_CONTRACT]) {
                                    balances.USDT = usdtData[USDT_CONTRACT] / 1e6;
                                    logDebug('✅ USDT (من API): ' + balances.USDT);
                                } else {
                                    balances.USDT = 0;
                                    logDebug('✅ USDT: 0');
                                }
                            } else {
                                balances.USDT = 0;
                                logDebug('✅ USDT: 0');
                            }
                        } else {
                            balances.USDT = 0;
                            logDebug('✅ USDT: 0');
                        }
                    } catch (apiError) {
                        logDebug('⚠️ طريقة 2 أيضاً فشلت: ' + apiError.message);
                        balances.USDT = 0;
                        logDebug('✅ USDT: 0');
                    }
                }
            } catch (e) {
                logDebug('⚠️ خطأ عام في USDT: ' + e.message);
                balances.USDT = 0;
            }
            
            updateDisplay();
        } catch (e) {
            logDebug('❌ خطأ في جلب الأرصدة: ' + e.message);
            throw new Error('فشل جلب الأرصدة: ' + e.message);
        }
    }
    
    function updateDisplay() {
        try {
            const currency = document.getElementById('currencyType').value;
            const percent = parseInt(document.getElementById('amountSlider').value);
            const balance = balances[currency];
            const amount = (balance * percent) / 100;
            
            // تأكد من أن القيم أرقام عادية
            let trxDisplay = balances.TRX;
            let usdtDisplay = balances.USDT;
            
            if (typeof trxDisplay === 'object') {
                trxDisplay = parseFloat(trxDisplay.toString());
            }
            if (typeof usdtDisplay === 'object') {
                usdtDisplay = parseFloat(usdtDisplay.toString());
            }
            
            document.getElementById('percentDisplay').textContent = percent + '%';
            document.getElementById('trxBalance').textContent = parseFloat(trxDisplay).toFixed(6);
            document.getElementById('usdtBalance').textContent = parseFloat(usdtDisplay).toFixed(6);
            document.getElementById('amountDisplay').textContent = parseFloat(amount).toFixed(6) + ' ' + currency;
        } catch (e) {
            logDebug('❌ خطأ في updateDisplay: ' + e.message);
        }
    }
    
    async function createTransaction() {
        const currency = document.getElementById('currencyType').value;
        const percent = parseInt(document.getElementById('amountSlider').value);
        const recipient = document.getElementById('recipientAddress').value.trim();
        const amount = (balances[currency] * percent) / 100;
        
        logDebug('📝 بدء تكوين معاملة ' + currency);
        
        if (!recipient) {
            logDebug('❌ خطأ: لم يتم إدخال عنوان المستقبل');
            showStatus('يرجى إدخال عنوان المستقبل', 'error');
            return;
        }
        
        if (!tronWeb.isAddress(recipient)) {
            logDebug('❌ خطأ: عنوان المستقبل غير صحيح');
            showStatus('عنوان المستقبل غير صحيح', 'error');
            return;
        }
        
        if (amount <= 0) {
            logDebug('❌ خطأ: المبلغ = 0');
            showStatus('يرجى تحديد مبلغ أكبر من صفر', 'error');
            return;
        }
        
        try {
            logDebug('⏳ جاري تكوين المعاملة...');
            if (currency === 'TRX') {
                logDebug('💰 نوع: TRX');
                currentTx = await tronWeb.transactionBuilder.sendTrx(
                    recipient,
                    tronWeb.toSun(amount),
                    currentAddress
                );
                logDebug('✅ تم تكوين معاملة TRX');
            } else {
                logDebug('💰 نوع: USDT');
                const amountWei = Math.floor(amount * 1e6);
                logDebug('📊 المبلغ (Wei): ' + amountWei);
                const tx = await tronWeb.transactionBuilder.triggerSmartContract(
                    USDT_CONTRACT,
                    'transfer(address,uint256)',
                    {},
                    [
                        { type: 'address', value: recipient },
                        { type: 'uint256', value: amountWei }
                    ],
                    currentAddress
                );
                currentTx = tx.transaction;
                logDebug('✅ تم تكوين معاملة USDT');
            }
            
            document.getElementById('txOutput').textContent = JSON.stringify(currentTx, null, 2);
            document.getElementById('txOutputSection').style.display = 'block';
            document.getElementById('signatureSection').style.display = 'block';
            document.getElementById('broadcastBtn').style.display = 'block';
            showStatus('تم تكوين المعاملة بنجاح', 'success');
        } catch (e) {
            logDebug('❌ خطأ في التكوين: ' + e.message);
            showStatus('خطأ في تكوين المعاملة: ' + e.message, 'error');
        }
    }
    
    function copyToClipboard(elementId) {
        const element = document.getElementById(elementId);
        const text = element.textContent;
        
        navigator.clipboard.writeText(text).then(() => {
            showStatus('✓ تم النسخ بنجاح', 'success');
        }).catch(() => {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showStatus('✓ تم النسخ بنجاح', 'success');
        });
    }
    
    function startBroadcast() {
        const signature = document.getElementById('signatureInput').value.trim();
        
        if (!signature) {
            showStatus('يرجى إدخال التوقيع', 'error');
            return;
        }
        
        if (!currentTx) {
            showStatus('لا توجد معاملة لبثها', 'error');
            return;
        }
        
        document.getElementById('broadcastBtn').style.display = 'none';
        document.getElementById('timerSection').classList.add('active');
        
        let countdown = 30;
        document.getElementById('timerCountdown').textContent = countdown;
        
        broadcastTimer = setInterval(() => {
            countdown--;
            document.getElementById('timerCountdown').textContent = countdown;
            
            if (countdown <= 0) {
                clearInterval(broadcastTimer);
                broadcastTransaction(signature);
            }
        }, 1000);
    }
    
    function cancelBroadcast() {
        clearInterval(broadcastTimer);
        document.getElementById('timerSection').classList.remove('active');
        document.getElementById('broadcastBtn').style.display = 'block';
        showStatus('تم إلغاء البث', 'error');
    }
    
    async function broadcastTransaction(signature) {
        try {
            const signedTx = JSON.parse(JSON.stringify(currentTx));
            if (!signedTx.signature) signedTx.signature = [];
            signedTx.signature.push(signature);
            
            const result = await tronWeb.trx.sendRawTransaction(signedTx);
            
            if (result.result) {
                showStatus('✓ تم البث بنجاح! ID: ' + result.txid, 'success');
                setTimeout(() => logout(), 3000);
            } else {
                showStatus('فشل البث: ' + JSON.stringify(result), 'error');
                document.getElementById('timerSection').classList.remove('active');
                document.getElementById('broadcastBtn').style.display = 'block';
            }
        } catch (e) {
            showStatus('خطأ في البث: ' + e.message, 'error');
            document.getElementById('timerSection').classList.remove('active');
            document.getElementById('broadcastBtn').style.display = 'block';
        }
    }
    
    function logout() {
        currentAddress = '';
        balances = { TRX: 0, USDT: 0 };
        currentTx = null;
        document.getElementById('walletAddress').value = '';
        document.getElementById('recipientAddress').value = '';
        document.getElementById('signatureInput').value = '';
        document.getElementById('amountSlider').value = 0;
        document.getElementById('loginSection').classList.remove('hidden');
        document.getElementById('walletSection').classList.remove('active');
        document.getElementById('txOutputSection').style.display = 'none';
        document.getElementById('signatureSection').style.display = 'none';
        document.getElementById('broadcastBtn').style.display = 'none';
        document.getElementById('timerSection').classList.remove('active');
        showStatus('تم تسجيل الخروج', 'success');
    }
    
    function showStatus(message, type) {
        const statusEl = document.getElementById('statusMessage');
        statusEl.textContent = message;
        statusEl.className = 'status-message show status-' + type;
        setTimeout(() => {
            statusEl.classList.remove('show');
        }, 4000);
    }
</script>

</body>
</html>
