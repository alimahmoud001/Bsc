<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محفظة TRON - البث المتصل</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 10px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #0a0a0a;
            border: 2px solid #ffd700;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }
        
        h1 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .login-section {
            margin-bottom: 20px;
        }
        
        .login-section.hidden {
            display: none;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ffd700;
            background: #1a1a1a;
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        
        input:focus, select:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #ffed4e;
            transform: translateY(-2px);
        }
        
        button:disabled {
            background: #999;
            cursor: not-allowed;
            transform: none;
        }
        
        .balance-display {
            background: #1a1a1a;
            border: 2px solid #ffd700;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .balance-item {
            margin: 10px 0;
            font-size: 16px;
        }
        
        .balance-label {
            color: #ffd700;
            font-weight: bold;
        }
        
        .balance-value {
            color: #00ff00;
            font-size: 18px;
            font-weight: bold;
        }
        
        .slider-container {
            margin: 20px 0;
        }
        
        .slider-label {
            display: flex;
            justify-content: space-between;
            color: #ffd700;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        input[type="range"] {
            width: 100%;
            height: 8px;
            cursor: pointer;
        }
        
        .amount-display {
            background: #1a1a1a;
            border: 2px solid #ffd700;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            color: #00ff00;
            font-weight: bold;
            margin-top: 10px;
        }
        
        .transaction-output {
            background: #1a1a1a;
            border: 2px solid #ffd700;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            word-break: break-all;
        }
        
        .copy-btn {
            background: #00ff00;
            color: #000;
            padding: 8px 15px;
            font-size: 12px;
            margin-top: 10px;
        }
        
        .copy-btn:hover {
            background: #00dd00;
        }
        
        .status-message {
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
            font-weight: bold;
        }
        
        .status-success {
            background: #0a3a0a;
            color: #00ff00;
            border: 2px solid #00ff00;
        }
        
        .status-error {
            background: #3a0a0a;
            color: #ff0000;
            border: 2px solid #ff0000;
        }
        
        .status-info {
            background: #0a1a3a;
            color: #00aaff;
            border: 2px solid #00aaff;
        }
        
        .debug-log {
            background: #0a0a0a;
            border: 2px solid #666;
            border-radius: 8px;
            padding: 10px;
            margin-top: 15px;
            max-height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #888;
        }
        
        .debug-log-entry {
            margin: 3px 0;
        }
        
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        
        .button-group button {
            margin: 0;
        }
        
        .hidden {
            display: none;
        }
        
        .countdown {
            color: #ff0000;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 محفظة TRON</h1>
        
        <!-- قسم تسجيل الدخول -->
        <div class="login-section" id="loginSection">
            <div class="input-group">
                <label for="walletAddress">أدخل عنوان المحفظة:</label>
                <input type="text" id="walletAddress" placeholder="T..." value="">
            </div>
            <button onclick="login()">تسجيل الدخول</button>
        </div>
        
        <!-- قسم المحفظة النشطة -->
        <div id="walletSection" class="hidden">
            <!-- عرض الأرصدة -->
            <div class="balance-display">
                <div class="balance-item">
                    <span class="balance-label">رصيد TRX:</span>
                    <span class="balance-value" id="trxBalance">0.000000</span>
                </div>
                <div class="balance-item">
                    <span class="balance-label">رصيد USDT:</span>
                    <span class="balance-value" id="usdtBalance">0.000000</span>
                </div>
            </div>
            
            <!-- اختيار العملة -->
            <div class="input-group">
                <label for="currencyType">اختر العملة:</label>
                <select id="currencyType" onchange="updateDisplay()">
                    <option value="TRX">TRX - Tron</option>
                    <option value="USDT">USDT - TRC20</option>
                </select>
            </div>
            
            <!-- مؤشر النسبة المئوية -->
            <div class="slider-container">
                <div class="slider-label">
                    <span>النسبة المئوية:</span>
                    <span id="percentDisplay">0%</span>
                </div>
                <input type="range" id="amountSlider" min="0" max="100" value="0" oninput="updateDisplay()">
                <div class="amount-display" id="amountDisplay">TRX 0.000000</div>
            </div>
            
            <!-- عنوان المستقبل -->
            <div class="input-group">
                <label for="recipientAddress">عنوان المستقبل:</label>
                <input type="text" id="recipientAddress" placeholder="T..." value="">
            </div>
            
            <!-- الأزرار -->
            <div class="button-group">
                <button onclick="createTransaction()">تكوين المعاملة</button>
                <button onclick="logout()" style="background: #ff6b6b;">تسجيل الخروج</button>
            </div>
            
            <!-- رسالة الحالة -->
            <div id="statusMessage"></div>
            
            <!-- المعاملة غير الموقعة -->
            <div id="unsignedTxSection" class="hidden">
                <h3 style="color: #ffd700; margin-top: 20px;">المعاملة غير الموقعة:</h3>
                <div class="transaction-output" id="unsignedTx"></div>
                <button class="copy-btn" onclick="copyUnsignedTx()">📋 نسخ المعاملة</button>
            </div>
            
            <!-- حقل التوقيع -->
            <div id="signatureSection" class="hidden">
                <h3 style="color: #ffd700; margin-top: 20px;">أدخل التوقيع:</h3>
                <div class="input-group">
                    <input type="text" id="signatureInput" placeholder="التوقيع من الموقّع البارد...">
                </div>
                <button onclick="broadcastTransaction()" style="background: #00ff00; color: #000;">بث المعاملة</button>
                <div id="countdownDisplay"></div>
            </div>
        </div>
        
        <!-- سجل التشخيص -->
        <div class="debug-log" id="debugLog"></div>
    </div>

    <script>
        // ============================================
        // Polyfill محلي كامل لـ Buffer
        // ============================================
        (function() {
            if (typeof window.Buffer !== 'undefined') {
                return; // Buffer موجود بالفعل
            }
            
            // تعريف كائن Buffer محلي
            window.Buffer = {
                // دالة from - الأهم
                from: function(data, encoding) {
                    encoding = encoding || 'utf8';
                    
                    if (typeof data === 'string') {
                        const arr = [];
                        for (let i = 0; i < data.length; i++) {
                            arr.push(data.charCodeAt(i) & 0xFF);
                        }
                        return new Uint8Array(arr);
                    } else if (data instanceof ArrayBuffer) {
                        return new Uint8Array(data);
                    } else if (Array.isArray(data)) {
                        return new Uint8Array(data);
                    } else if (data instanceof Uint8Array) {
                        return data;
                    }
                    return new Uint8Array(0);
                },
                
                // دالة alloc
                alloc: function(size) {
                    return new Uint8Array(size);
                },
                
                // دالة isBuffer
                isBuffer: function(obj) {
                    return obj instanceof Uint8Array;
                },
                
                // دالة concat
                concat: function(list) {
                    let totalLength = 0;
                    for (let i = 0; i < list.length; i++) {
                        totalLength += list[i].length;
                    }
                    const result = new Uint8Array(totalLength);
                    let offset = 0;
                    for (let i = 0; i < list.length; i++) {
                        result.set(list[i], offset);
                        offset += list[i].length;
                    }
                    return result;
                }
            };
            
            // تأكيد أن Buffer متوفر عالمياً
            if (typeof global !== 'undefined') {
                global.Buffer = window.Buffer;
            }
        })();
        
        // ============================================
        // متغيرات التطبيق
        // ============================================
        const USDT_CONTRACT = 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t';
        const USDT_DECIMALS = 6;
        const TRX_DECIMALS = 6;
        
        let tronWeb = null;
        let currentAddress = null;
        let balances = { TRX: 0, USDT: 0 };
        let currentTransaction = null;
        let broadcastCountdown = null;
        
        function logDebug(message) {
            const debugLog = document.getElementById('debugLog');
            const entry = document.createElement('div');
            entry.className = 'debug-log-entry';
            entry.textContent = message;
            debugLog.appendChild(entry);
            debugLog.scrollTop = debugLog.scrollHeight;
        }
        
        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = 'status-message status-' + type;
        }
        
        async function initTronWeb() {
            logDebug('🔧 بدء تهيئة TronWeb...');
            try {
                tronWeb = new TronWeb({
                    fullHost: 'https://api.trongrid.io'
                });
                logDebug('✅ تمت تهيئة TronWeb بنجاح');
                return true;
            } catch (e) {
                logDebug('❌ فشل تهيئة TronWeb: ' + e.message);
                return false;
            }
        }
        
        async function login() {
            const addressInput = document.getElementById('walletAddress').value.trim();
            
            if (!addressInput) {
                showStatus('❌ يرجى إدخال عنوان المحفظة', 'error');
                return;
            }
            
            if (!tronWeb) {
                const initialized = await initTronWeb();
                if (!initialized) {
                    showStatus('❌ فشل الاتصال بالشبكة', 'error');
                    return;
                }
            }
            
            logDebug('🔐 محاولة تسجيل الدخول للعنوان: ' + addressInput);
            
            try {
                if (!tronWeb.isAddress(addressInput)) {
                    showStatus('❌ عنوان غير صحيح', 'error');
                    logDebug('❌ العنوان غير صحيح');
                    return;
                }
                
                currentAddress = addressInput;
                logDebug('✓ العنوان صحيح');
                
                await fetchBalances();
                
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('walletSection').classList.remove('hidden');
                showStatus('✅ تم تسجيل الدخول بنجاح', 'success');
                logDebug('✅ تم جلب الأرصدة بنجاح');
                
            } catch (e) {
                showStatus('❌ خطأ: ' + e.message, 'error');
                logDebug('❌ خطأ في تسجيل الدخول: ' + e.message);
            }
        }
        
        async function fetchBalances() {
            logDebug('⏳ جاري جلب الأرصدة...');
            
            try {
                logDebug('💰 جاري جلب رصيد TRX...');
                const trxSun = await tronWeb.trx.getBalance(currentAddress);
                balances.TRX = trxSun / Math.pow(10, TRX_DECIMALS);
                logDebug('✅ رصيد TRX: ' + balances.TRX);
                
                logDebug('📊 جاري البحث عن USDT في سجلات TRC20...');
                
                const response = await fetch('https://api.trongrid.io/v1/accounts/' + currentAddress);
                const data = await response.json();
                
                balances.USDT = 0;
                
                if (data.data && data.data.length > 0) {
                    const account = data.data[0];
                    
                    if (account.trc20 && Array.isArray(account.trc20)) {
                        for (let token of account.trc20) {
                            const tokenAddress = Object.keys(token)[0];
                            if (tokenAddress === USDT_CONTRACT) {
                                const usdtValue = token[tokenAddress];
                                balances.USDT = usdtValue / Math.pow(10, USDT_DECIMALS);
                                logDebug('✅ تم العثور على USDT في سجل TRC20: ' + balances.USDT);
                                break;
                            }
                        }
                    }
                    
                    if (balances.USDT === 0 && account.asset_v2) {
                        for (let asset of account.asset_v2) {
                            if (asset.key === USDT_CONTRACT) {
                                balances.USDT = asset.value / Math.pow(10, USDT_DECIMALS);
                                logDebug('✅ تم العثور على USDT في سجل Asset_v2: ' + balances.USDT);
                                break;
                            }
                        }
                    }
                }
                
                if (balances.USDT === 0) {
                    logDebug('✅ رصيد USDT: 0');
                }
                
                updateDisplay();
                
            } catch (e) {
                logDebug('❌ خطأ في جلب الأرصدة: ' + e.message);
                updateDisplay();
            }
        }
        
        function updateDisplay() {
            try {
                const currency = document.getElementById('currencyType').value;
                const percent = parseInt(document.getElementById('amountSlider').value);
                const balance = balances[currency];
                const amount = (balance * percent) / 100;
                
                document.getElementById('percentDisplay').textContent = percent + '%';
                document.getElementById('trxBalance').textContent = balances.TRX.toFixed(6);
                document.getElementById('usdtBalance').textContent = balances.USDT.toFixed(6);
                document.getElementById('amountDisplay').textContent = amount.toFixed(6) + ' ' + currency;
            } catch (e) {
                logDebug('❌ خطأ في updateDisplay: ' + e.message);
            }
        }
        
        async function createTransaction() {
            const currency = document.getElementById('currencyType').value;
            const percent = parseInt(document.getElementById('amountSlider').value);
            const recipient = document.getElementById('recipientAddress').value.trim();
            
            if (!recipient) {
                showStatus('❌ يرجى إدخال عنوان المستقبل', 'error');
                return;
            }
            
            if (!tronWeb.isAddress(recipient)) {
                showStatus('❌ عنوان المستقبل غير صحيح', 'error');
                return;
            }
            
            if (percent === 0) {
                showStatus('❌ يرجى تحديد مبلغ أكبر من 0', 'error');
                return;
            }
            
            const balance = balances[currency];
            const amount = (balance * percent) / 100;
            
            logDebug('📝 جاري تكوين معاملة ' + currency + ' بمبلغ ' + amount);
            
            try {
                let txData = null;
                
                if (currency === 'TRX') {
                    logDebug('🔄 تكوين معاملة TRX...');
                    const amountSun = Math.floor(amount * Math.pow(10, TRX_DECIMALS));
                    txData = await tronWeb.transactionBuilder.sendTrx(recipient, amountSun, currentAddress);
                    logDebug('✅ تم تكوين معاملة TRX بنجاح');
                } else if (currency === 'USDT') {
                    logDebug('🔄 تكوين معاملة USDT (TRC20)...');
                    
                    // التأكد من وجود Buffer
                    logDebug('✓ التحقق من Buffer...');
                    if (typeof window.Buffer === 'undefined' || typeof window.Buffer.from !== 'function') {
                        throw new Error('Buffer.from غير متوفر - يرجى تحديث الصفحة');
                    }
                    logDebug('✓ Buffer.from متوفر');
                    
                    const amountUSDT = Math.floor(amount * Math.pow(10, USDT_DECIMALS));
                    logDebug('💰 المبلغ بالـ Wei: ' + amountUSDT);
                    
                    const toAddress = tronWeb.address.toHex(recipient);
                    logDebug('📍 عنوان المستقبل (Hex): ' + toAddress);
                    
                    const parameter = [
                        { type: 'address', value: toAddress },
                        { type: 'uint256', value: amountUSDT }
                    ];
                    
                    logDebug('📦 جاري إرسال البيانات للعقد الذكي...');
                    
                    txData = await tronWeb.transactionBuilder.triggerSmartContract(
                        USDT_CONTRACT,
                        'transfer(address,uint256)',
                        { feeLimit: 100000000 },
                        parameter,
                        currentAddress
                    );
                    
                    logDebug('✅ استجابة العقد الذكي تم استقبالها');
                    
                    if (txData && txData.transaction) {
                        txData = txData.transaction;
                        logDebug('✅ تم استخراج بيانات المعاملة من الاستجابة');
                    } else if (txData) {
                        logDebug('✅ تم تكوين معاملة USDT بنجاح');
                    } else {
                        throw new Error('لم يتم الحصول على بيانات المعاملة من العقد الذكي');
                    }
                }
                
                if (!txData) {
                    throw new Error('فشل في الحصول على بيانات المعاملة');
                }
                
                currentTransaction = txData;
                
                const unsignedTxJson = JSON.stringify(txData, null, 2);
                document.getElementById('unsignedTx').textContent = unsignedTxJson;
                document.getElementById('unsignedTxSection').classList.remove('hidden');
                document.getElementById('signatureSection').classList.remove('hidden');
                
                showStatus('✅ تم تكوين المعاملة بنجاح', 'success');
                logDebug('✅ تم تكوين المعاملة: ' + currency);
                
            } catch (e) {
                showStatus('❌ فشل تكوين المعاملة: ' + e.message, 'error');
                logDebug('❌ خطأ في تكوين المعاملة: ' + e.message);
                logDebug('📋 تفاصيل الخطأ: ' + e.stack);
            }
        }
        
        function copyUnsignedTx() {
            const unsignedTxElement = document.getElementById('unsignedTx');
            const text = unsignedTxElement.textContent;
            navigator.clipboard.writeText(text).then(() => {
                showStatus('✅ تم نسخ المعاملة', 'success');
            }).catch(() => {
                showStatus('❌ فشل النسخ', 'error');
            });
        }
        
        function broadcastTransaction() {
            const signature = document.getElementById('signatureInput').value.trim();
            
            if (!signature) {
                showStatus('❌ يرجى إدخال التوقيع', 'error');
                return;
            }
            
            if (!currentTransaction) {
                showStatus('❌ لا توجد معاملة لبثها', 'error');
                return;
            }
            
            showStatus('⏳ جاري البث خلال 30 ثانية... يمكنك الإلغاء', 'info');
            
            let countdown = 30;
            const countdownDisplay = document.getElementById('countdownDisplay');
            
            broadcastCountdown = setInterval(() => {
                countdownDisplay.innerHTML = '<div class="countdown">الوقت المتبقي: ' + countdown + ' ثانية</div>';
                
                if (countdown <= 0) {
                    clearInterval(broadcastCountdown);
                    performBroadcast(signature);
                }
                countdown--;
            }, 1000);
        }
        
        async function performBroadcast(signature) {
            try {
                logDebug('📡 جاري بث المعاملة...');
                
                currentTransaction.signature = [signature];
                
                const result = await tronWeb.trx.sendRawTransaction(currentTransaction);
                
                if (result.result) {
                    showStatus('✅ تم بث المعاملة بنجاح! معرف: ' + result.txid, 'success');
                    logDebug('✅ معرف المعاملة: ' + result.txid);
                    
                    setTimeout(() => {
                        document.getElementById('unsignedTxSection').classList.add('hidden');
                        document.getElementById('signatureSection').classList.add('hidden');
                        document.getElementById('signatureInput').value = '';
                        document.getElementById('countdownDisplay').innerHTML = '';
                    }, 2000);
                } else {
                    showStatus('❌ فشل البث: ' + (result.message || 'خطأ غير معروف'), 'error');
                    logDebug('❌ فشل البث: ' + (result.message || 'خطأ غير معروف'));
                }
            } catch (e) {
                showStatus('❌ خطأ في البث: ' + e.message, 'error');
                logDebug('❌ خطأ في البث: ' + e.message);
            }
        }
        
        function logout() {
            currentAddress = null;
            currentTransaction = null;
            balances = { TRX: 0, USDT: 0 };
            
            document.getElementById('walletAddress').value = '';
            document.getElementById('recipientAddress').value = '';
            document.getElementById('signatureInput').value = '';
            document.getElementById('amountSlider').value = 0;
            document.getElementById('unsignedTxSection').classList.add('hidden');
            document.getElementById('signatureSection').classList.add('hidden');
            document.getElementById('statusMessage').textContent = '';
            document.getElementById('countdownDisplay').innerHTML = '';
            
            document.getElementById('walletSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            
            showStatus('✅ تم تسجيل الخروج', 'success');
            logDebug('🚪 تم تسجيل الخروج');
        }
        
        window.addEventListener('load', async () => {
            logDebug('📱 جاري تحميل الصفحة...');
            logDebug('✓ Buffer متوفر: ' + (typeof window.Buffer !== 'undefined'));
            logDebug('✓ Buffer.from متوفر: ' + (typeof window.Buffer.from === 'function'));
            await initTronWeb();
        });
    </script>
</body>
</html>
