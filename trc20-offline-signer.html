<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقّع TRON البارد</title>
    
    <script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.0/dist/TronWeb.js"></script>
    <script>
        // تعريف Buffer محلي وقوي جداً لضمان عمل وظائف التوقيع
        (function() {
            if (typeof window.Buffer === 'undefined') {
                window.Buffer = function(data, enc) { return new Uint8Array(data); };
                window.Buffer.from = function(data, enc) {
                    if (typeof data === 'string') {
                        if (enc === 'hex') {
                            const match = data.match(/.{1,2}/g);
                            return new Uint8Array(match ? match.map(byte => parseInt(byte, 16)) : []);
                        }
                        return new TextEncoder().encode(data);
                    }
                    return new Uint8Array(data);
                };
                window.Buffer.isBuffer = function(obj) { return obj instanceof Uint8Array; };
                window.Buffer.alloc = function(size) { return new Uint8Array(size); };
            }
        })();
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: sans-serif; padding: 10px; }
        .container { max-width: 500px; margin: 0 auto; background: #0a0a0a; border: 2px solid #ffd700; border-radius: 15px; padding: 20px; }
        h1 { text-align: center; color: #ffd700; margin-bottom: 20px; font-size: 22px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; color: #ffd700; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        input, textarea { width: 100%; padding: 12px; border: 2px solid #ffd700; background: #1a1a1a; color: #fff; border-radius: 8px; font-family: inherit; }
        textarea { height: 100px; resize: none; font-size: 12px; font-family: monospace; }
        button { width: 100%; padding: 12px; background: #ffd700; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .status-message { padding: 10px; border-radius: 8px; margin: 10px 0; text-align: center; font-weight: bold; }
        .status-success { background: #0a3a0a; color: #00ff00; border: 2px solid #00ff00; }
        .status-error { background: #3a0a0a; color: #ff0000; border: 2px solid #ff0000; }
        .output-section { background: #1a1a1a; border: 2px solid #00ff00; border-radius: 8px; padding: 15px; margin-top: 20px; }
        .output-text { word-break: break-all; font-family: monospace; font-size: 13px; color: #00ff00; margin-bottom: 10px; }
        .copy-btn { background: #00ff00; color: #000; width: auto; padding: 8px 15px; display: inline-block; }
        .debug-log { background: #0a0a0a; border: 1px solid #444; padding: 10px; margin-top: 15px; max-height: 100px; overflow-y: auto; font-size: 11px; color: #888; }
        .hidden { display: none; }
        .warning { color: #ff6b6b; font-size: 12px; text-align: center; margin-bottom: 15px; border: 1px solid #ff6b6b; padding: 5px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 موقّع TRON البارد</h1>
        <div class="warning">⚠️ استخدم هذا الملف على جهاز غير متصل بالإنترنت لزيادة الأمان</div>
        
        <div class="input-group">
            <label>المفتاح الخاص (Private Key):</label>
            <input type="password" id="privateKey" placeholder="أدخل مفتاحك الخاص هنا...">
        </div>
        
        <div class="input-group">
            <label>كود المعاملة (Unsigned JSON):</label>
            <textarea id="unsignedJson" placeholder="الصق الكود من المحفظة هنا..."></textarea>
        </div>
        
        <button onclick="signTransaction()">توقيع المعاملة 🖋️</button>
        
        <div id="statusMessage"></div>
        
        <div id="outputSection" class="output-section hidden">
            <label style="color: #00ff00;">التوقيع الناتج (Signature):</label>
            <div id="signatureOutput" class="output-text"></div>
            <button class="copy-btn" onclick="copySignature()">📋 نسخ التوقيع</button>
        </div>
        
        <div id="debugLog" class="debug-log"></div>
    </div>

    <script>
        let tronWeb;

        function log(m) {
            const d = document.getElementById('debugLog');
            d.innerHTML += `<div>> ${m}</div>`;
            d.scrollTop = d.scrollHeight;
        }

        function showStatus(m, type) {
            const s = document.getElementById('statusMessage');
            s.textContent = m;
            s.className = 'status-message status-' + type;
        }

        async function signTransaction() {
            const privKey = document.getElementById('privateKey').value.trim();
            const jsonStr = document.getElementById('unsignedJson').value.trim();
            
            if (!privKey || !jsonStr) {
                return showStatus('❌ يرجى إدخال المفتاح الخاص وكود المعاملة', 'error');
            }

            log('جاري تهيئة الموقّع...');
            try {
                // تهيئة TronWeb محلياً بدون إنترنت
                tronWeb = new TronWeb({
                    fullHost: 'https://api.trongrid.io',
                    privateKey: privKey
                });

                log('جاري تحليل كود المعاملة...');
                const transaction = JSON.parse(jsonStr);

                log('جاري التوقيع...');
                // استخدام TronWeb للتوقيع المباشر
                const signedTx = await tronWeb.trx.sign(transaction, privKey);
                
                if (signedTx && signedTx.signature && signedTx.signature.length > 0) {
                    const signature = signedTx.signature[0];
                    document.getElementById('signatureOutput').textContent = signature;
                    document.getElementById('outputSection').classList.remove('hidden');
                    showStatus('✅ تم التوقيع بنجاح!', 'success');
                    log('تم التوقيع بنجاح');
                } else {
                    throw new Error('فشل استخراج التوقيع من المعاملة');
                }
            } catch (e) {
                showStatus('❌ خطأ: ' + e.message, 'error');
                log('خطأ: ' + e.message);
            }
        }

        function copySignature() {
            const sig = document.getElementById('signatureOutput').textContent;
            navigator.clipboard.writeText(sig);
            showStatus('✅ تم نسخ التوقيع!', 'success');
        }
    </script>
</body>
</html>
